---
- hosts: localhost
  pre_tasks:
  #
  # the image name can be set in the below fact.
  #
  - name: Set image name
    set_fact:
      image_name: "alma-image"
    tags: always

  # refused before the controller plays, so a forgotten marker never reaches the image
  - name: Verify that -i and on_node are given together
    fail:
      msg: "Live nodes need -i with a node inventory that sets on_node=true (see nodes.yml.example), and on_node is only valid with -i"
    when: (on_node | default(False) | bool) == (ansible_inventory_sources == lookup('config', 'DEFAULT_HOST_LIST'))
    tags: always

  - name: Set the hosts to set up
    set_fact:
      setup_hosts: "{{ 'all:!controllers' if on_node | default(False) | bool else image_name ~ '.osimages.luna' }}"
    tags: always

- import_playbook: imports/trinity-redhat-image-create.yml
  vars:
    image_name: "{{ hostvars['localhost']['image_name'] }}"
    # The password to set up for the root user in the image.
    # If empty, it will be generated at random.
    #
    image_password:
    #
    # https://hub.docker.com/_/almalinux/tags
    alternative_distribution: almalinux:latest
    alternative_image_source: 'docker'
    alternative_image_distr: 'almalinux'

- import_playbook: imports/trinity-redhat-image-setup.yml
  vars:
    hostlist: "{{ hostvars['localhost']['setup_hosts'] }}"

- hosts:
    - "{{ hostvars['localhost']['setup_hosts'] }}"
  roles:
    - role: trinity/slurm
      slurm_conf_path: '{{ trix_shared }}/etc/slurm'
      slurm_spool_path: '{{ trix_shared }}/var/spool/slurm'
      munge_conf_path: '{{ trix_shared }}/etc/munge'
      when: "'slurm' in workload_manager "
      tags: slurm

- hosts: controllers
  roles:
    - role: luna/osimage-pack
      vars:
         params:
            image_name: "{{ hostvars['localhost']['image_name'] }}"
      when: not on_node | default(False) | bool
      tags: pack-images
