[defaults]
host_key_checking = False
inventory = hosts,/etc/ansible/hosts,dynamic_hosts
retry_files_save_path = ~/.ansible/retry-files
# The in-image build phase can run inside lchroot's bwrap sandbox instead of a raw
# chroot. Select it with LUNA_IMAGE_CONNECTION=lchroot (see site/dynamic_hosts).
connection_plugins = plugins/connection
log_path = /var/log/trinity.log
