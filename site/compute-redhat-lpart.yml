---
# compute-redhat-lpart.yml -- generic RedHat-family (Rocky 8/9/10) compute-image
# build driver for the lpart multi-distro campaign. The stock compute-redhat.yml
# hardcodes image_name=compute-image via set_fact; this threads -e image_name
# through so build-image.sh can build rocky8-image / rocky9-image / rocky10-image
# from the SAME playbook. All el-version enablement lives in guarded patches to
# the stock trx ansible (patches/trinityx-site):
#   * redhat/base.yml   -- cross-major EL bootstrap when -e image_el_baseurl /
#                          image_el_releasever are set (dnf --installroot; el8 & el10;
#                          off by default -> native el9 byte-identical). (patch 02)
#   * redhat/osgrab.yml -- optional luna2_client_package override (patch 01).
# No alternative_distribution: the normal from-scratch base.yml path does the
# bootstrap. build-image.sh passes image_name / image_el_* / luna2_client_package
# via -e. Part of the lpart installer. GPLv3+, NO WARRANTY.

- hosts: localhost
  pre_tasks:
  - name: Set image name
    set_fact:
      image_name: "{{ image_name | default('compute-image') }}"
    tags: always

- import_playbook: imports/trinity-redhat-image-create.yml
  vars:
    image_name: "{{ hostvars['localhost']['image_name'] }}"
    image_password:

- import_playbook: imports/trinity-redhat-image-setup.yml
  vars:
    hostlist: "{{ hostvars['localhost']['image_name'] }}.osimages.luna"

- hosts:
    - "{{ hostvars['localhost']['image_name'] }}.osimages.luna"
  roles:
    - role: trinity/slurm
      slurm_conf_path: '{{ trix_shared }}/etc/slurm'
      slurm_spool_path: '{{ trix_shared }}/var/spool/slurm'
      munge_conf_path: '{{ trix_shared }}/etc/munge'
      when: "'slurm' in workload_manager "
      tags: slurm

- hosts: controllers
  roles:
    - role: luna/osimage-pack
      vars:
         params:
            image_name: "{{ hostvars['localhost']['image_name'] }}"
      tags: pack-images
