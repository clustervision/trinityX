---
- hosts: localhost
  pre_tasks:
  #
  # the image name can be set in the below fact.
  #
  - name: Set image name
    set_fact:
      # default keeps stock behaviour; -e image_name=<name> builds a named image
      # (rocky8-image / rocky9-image / ...) from this same playbook, which is what
      # the campaign's separate compute-redhat-lpart.yml existed to do.
      image_name: "{{ image_name | default('compute-image') }}"
    tags: always

- import_playbook: imports/trinity-redhat-image-create.yml
  vars:
    image_name: "{{ hostvars['localhost']['image_name'] }}"
    # The password to set up for the root user in the image.
    # If empty, it will be generated at random.
    #
    image_password:
    #
    # Alternative distribution build. Supported are Rocky + Centos, version 8, 9, 8.9, 9.3
    # or any docker image, e.g. rockylinux:8
    #alternative_distribution: Rocky-9.3
    # 
    # The alternative source can be 'base' or 'docker'
    #alternative_image_source: 'base'

# setup_hosts (the image, or the nodes given with -i) is set in imports/trinity-redhat-image-create.yml
- import_playbook: imports/trinity-redhat-image-setup.yml
  vars:
    hostlist: "{{ hostvars['localhost']['setup_hosts'] }}"

- hosts:
    - "{{ hostvars['localhost']['setup_hosts'] }}"
  roles:
    - role: trinity/slurm
      slurm_conf_path: '{{ trix_shared }}/etc/slurm'
      slurm_spool_path: '{{ trix_shared }}/var/spool/slurm'
      munge_conf_path: '{{ trix_shared }}/etc/munge'
      when: "'slurm' in workload_manager "
      tags: slurm

- hosts: controllers
  pre_tasks:
    # A repository of the list that is a directory of this controller was bound under the
    # image for the build alone; from here on its file in the image names the directory itself.
    - name: Point the image's repository files at the repositories themselves
      replace:
        path: "{{ trix_images }}/{{ hostvars['localhost']['image_name'] }}/etc/yum.repos.d/00-osimage-{{ item.id }}.repo"
        regexp: '^baseurl=.*$'
        replace: "baseurl={{ item.baseurl }}"
      loop: "{{ image_el_repos | default([]) }}"
      loop_control:
        label: "{{ item.id }}"
      when: not for_node | bool
      tags: always
  roles:
    - role: luna/osimage-pack
      vars:
         params:
            image_name: "{{ hostvars['localhost']['image_name'] }}"
      when: not for_node | bool
      tags: pack-images
