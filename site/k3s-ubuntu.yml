---
- hosts: localhost
  pre_tasks:
  #
  # the image name can be set in the below fact.
  #
  - name: Set image name
    set_fact:
      # default keeps stock behaviour; -e image_name=<name> builds a named image so
      # releases can live side by side (k3s-ubuntu2204-image / k3s-ubuntu2404-image), which matters
      # now that -e ubuntu_version selects 22.04 / 24.04 / 26.04 -- without it every
      # release would overwrite the same k3s-ubuntu-image.
      image_name: "{{ image_name | default('k3s-ubuntu-image') }}"
    tags: always

- import_playbook: imports/trinity-ubuntu-image-create.yml
  vars:
    image_name: "{{ hostvars['localhost']['image_name'] }}"
    # The password to set up for the root user in the image.
    # If empty, it will be generated at random.
    #
    image_password:
    #
    # Alternative distribution build. Supported are Ubuntu, version 20, 22, 24 and 26
    # or any docker image, e.g. ubuntu:rolling
    #alternative_distribution: Ubuntu-22
    # 
    # The alternative source can be 'base' or 'docker'
    #alternative_image_source: 'base'


- import_playbook: imports/trinity-ubuntu-image-setup.yml
  vars:
    hostlist: "{{ hostvars['localhost']['image_name'] }}.osimages.luna"

- hosts:
    - "{{ hostvars['localhost']['image_name'] }}.osimages.luna"
  roles:

    - role: trinity/kubernetes
      tags: kubernetes, k3s

- hosts: controllers
  roles:
    - role: luna/osimage-pack
      vars:
         params:
            image_name: "{{ hostvars['localhost']['image_name'] }}"
      tags: pack-images
