---
# Ubuntu login image wrapper.
#
# This mirrors the structure of login-default.yml, but uses the Ubuntu
# image creation/setup flow from compute-ubuntu.yml.
#
# Roles of the RedHat login setup that are RedHat-only and skipped for
# Ubuntu (packages, pcs-modules, tunables, rdma-centos, openhpc, nscd) are
# commented out in imports/trinity-ubuntu-login-setup.yml.

- hosts: localhost
  pre_tasks:
  #
  # the image name can be set in the below fact.
  #
  - name: Set Ubuntu release
    set_fact:
      # The Ubuntu release to build: 22 (jammy), 24 (noble) or 26 (resolute).
      # The codename is looked up from this number in trinity/image-create.
      ubuntu_version: "{{ ubuntu_version | default('24') }}"
    tags: always

  - name: Set image name
    set_fact:
      # The default release keeps the historic name 'login-ubuntu-image', which is what
      # existing groups and nodes already point at -- so re-running this playbook
      # rebuilds the image they use rather than a new one nothing references.
      # Any other release builds beside it: 22 gives 'login-ubuntu22-image'.
      # -e image_name=<name> overrides both.
      image_name: "{{ image_name | default(
          'login-ubuntu-image' if ubuntu_version == '24'
          else 'login-ubuntu' ~ ubuntu_version ~ '-image'
        ) }}"
    tags: always

  - name: Verify if luna secret vault exists
    ansible.builtin.stat:
      path: "/trinity/local/etc/ssl/secret.key"
    register: stat_secret_key
    tags: always

  - block:
    - name: Import luna secret key
      ansible.builtin.slurp:
        src: "/trinity/local/etc/ssl/secret.key"
      register: luna_secret_key_b64

    - name: Set Luna secret key
      ansible.builtin.set_fact:
        luna_secret_key: "{{ luna_secret_key_b64['content'] | b64decode }}"
    when: stat_secret_key.stat.exists
    tags: always

- import_playbook: imports/trinity-ubuntu-image-create.yml
  vars:
    image_name: "{{ hostvars['localhost']['image_name'] }}"
    ubuntu_version: "{{ hostvars['localhost']['ubuntu_version'] }}"
    # The password to set up for the root user in the image.
    # If empty, it will be generated at random.
    #
    image_password:
    #
    # Alternative distribution build. Supported are Ubuntu, version 20, 22, 24 and 26
    # or any docker image, e.g. ubuntu:rolling
    #alternative_distribution: Ubuntu-22
    # 
    # The alternative source can be 'base' or 'docker'
    #alternative_image_source: 'base'

- import_playbook: imports/trinity-ubuntu-login-setup.yml
  vars:
    hostlist: "{{ hostvars['localhost']['image_name'] }}.osimages.luna"
    in_login_image: true
    luna_secret_key: "{{ hostvars['localhost']['luna_secret_key'] }}"
  tags: build

# slurm runs inside imports/trinity-ubuntu-login-setup.yml with
# enable_slurm_pam: false, as for RedHat: pam_slurm_adopt on a login node
# would lock out every user without a running job.

- hosts: controllers
  pre_tasks:
    - name: Unmount the image /proc before packing
      shell: "! mountpoint -q {{ trix_images }}/{{ hostvars['localhost']['image_name'] }}/proc || umount {{ trix_images }}/{{ hostvars['localhost']['image_name'] }}/proc"
      tags: always
  roles:
    - role: luna/osimage-pack
      vars:
         params:
            image_name: "{{ hostvars['localhost']['image_name'] }}"
      tags: pack-images
