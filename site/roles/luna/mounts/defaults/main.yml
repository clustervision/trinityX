---
# The shares of the cluster, one entry per mountpoint, in the network mounts
# document grammar luna stores on the cluster (luna cluster showmounts).
# Two words are resolved here before the document is pushed:
#   - a client `to: controllers` becomes one client per controller hostname,
#     the floating name included on an HA pair
#   - a share whose path is a cross-mounted partition in shared_fs_disks gets
#     `source: <shared_fs_prefix><path>`, the directory the export lives behind
luna_mounts: []

luna_mounts_document: '{{ trix_tmpdir }}/luna-mounts.json'
