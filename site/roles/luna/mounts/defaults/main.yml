---
# A helper the nfs and nfs-mounts roles include: hands their entries to Luna's
# network mounts document, one addmount each. It asks Luna whether it carries the
# document at all and never fails on a Luna without it: it answers through
# luna_mounts_available and the caller renders the legacy way instead.
luna_mounts_entries: []

# where the luna CLI runs: the controller itself, or localhost when the caller
# runs inside an image (images are built on the controller)
luna_mounts_host: '{{ inventory_hostname }}'

# leave alone an entry that already has its mount half (the image plays, whose
# view of a share must not undo the controller's); one with only its export half
# is still completed
luna_mounts_fill_only: false
