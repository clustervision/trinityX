---

luna_image_path: /trinity/images/nonexistent

# Off by default: a console= naming a port the board does not have can hang the
# boot, not merely lose the output - the 8250 console waits on a transmit-ready
# bit that never comes. We cannot know the right port before a node has booted,
# so we do not guess at it on the boot that would be broken by guessing wrong.
luna_console_redirection: false

# Used only when the toggle is on. ttyS0 is COM1: on a board that has one serial
# port at all it is that one, which makes it the least dangerous value to carry.
# It is not where the BMC's serial-over-LAN usually sits - Supermicro, Dell iDRAC
# and HPE iLO all put SOL on COM2/ttyS1 - so a site enabling this will often want
# ttyS1 here, and should confirm the port on its hardware before setting it.
# The last console= is the one the kernel makes /dev/console, hence the serial
# entry last: kernel messages to both, login prompt to the serial port.
luna_console_kerneloptions: "console=tty0 console=ttyS0,115200n8"

luna_image_detect_major_version:
  - name: RedHat
    command: "cat {{ luna_image_path }}/etc/redhat-release | awk -F 'release ' '{ print $2 }' | awk -F '.' '{ print $1 }' |  grep -oE '[0-9]+' | grep '^.\\+$' || echo {{ ansible_distribution_major_version }}"
  - name: Ubuntu
    command: "grep DISTRIB_RELEASE {{ luna_image_path }}/etc/lsb-release | awk -F'=' '{ print $2 }' | awk -F '.' '{ print $1 }' | grep '^.\\+$' || echo '22'"
  - name: Debian
    command: "grep DISTRIB_RELEASE {{ luna_image_path }}/etc/lsb-release | awk -F'=' '{ print $2 }' | awk -F '.' '{ print $1 }' | grep '^.\\+$' || echo '22'"
  - name: OpenSuse
    command: "grep VERSION {{ luna_image_path }}/etc/SUSE-brand | awk -F' = ' '{ print $2 }' || echo 15"
  - name: Suse
    command: "grep VERSION {{ luna_image_path }}/etc/SUSE-brand | awk -F' = ' '{ print $2 }' || echo 15"
  - name: SLE
    command: "grep VERSION {{ luna_image_path }}/etc/SUSE-brand | awk -F' = ' '{ print $2 }' || echo 15"

