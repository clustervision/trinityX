---

luna_image_path: /trinity/images/nonexistent

# Serial console for the BMC's serial-over-LAN, added to an image's kernel
# options when luna_console_redirection is on. The last console= is what the
# kernel makes /dev/console, so the serial port comes last: kernel messages go
# to both, systemd output and the login prompt go to the serial port. ttyS0 is
# COM1; boards that redirect COM2 want ttyS1, and the speed must match the
# BMC's SOL bit rate (ipmitool sol info).
luna_console_kerneloptions: "console=tty0 console=ttyS0,115200n8"

luna_image_detect_major_version:
  - name: RedHat
    command: "cat {{ luna_image_path }}/etc/redhat-release | awk -F 'release ' '{ print $2 }' | awk -F '.' '{ print $1 }' |  grep -oE '[0-9]+' | grep '^.\\+$' || echo {{ ansible_distribution_major_version }}"
  - name: Ubuntu
    command: "grep DISTRIB_RELEASE {{ luna_image_path }}/etc/lsb-release | awk -F'=' '{ print $2 }' | awk -F '.' '{ print $1 }' | grep '^.\\+$' || echo '22'"
  - name: Debian
    command: "grep DISTRIB_RELEASE {{ luna_image_path }}/etc/lsb-release | awk -F'=' '{ print $2 }' | awk -F '.' '{ print $1 }' | grep '^.\\+$' || echo '22'"
  - name: OpenSuse
    command: "grep VERSION {{ luna_image_path }}/etc/SUSE-brand | awk -F' = ' '{ print $2 }' || echo 15"
  - name: Suse
    command: "grep VERSION {{ luna_image_path }}/etc/SUSE-brand | awk -F' = ' '{ print $2 }' || echo 15"
  - name: SLE
    command: "grep VERSION {{ luna_image_path }}/etc/SUSE-brand | awk -F' = ' '{ print $2 }' || echo 15"

