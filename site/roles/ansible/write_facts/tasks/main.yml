---

- name: Set facts
  set_fact:
    data:
      trix_ctrl_hostname: "{{ trix_ctrl_hostname }}"
      trix_ctrl_ip: "{{ trix_ctrl_ip }}"
      luna_username: "{{ luna_username }}"
      luna_password: "{{ luna_password }}"
      luna_secret_key: "{{ luna_secret_key }}"
      luna_protocol: "{{ luna_protocol }}"
      trix_domain: "{{ trix_domain }}"
      trix_login_fqdn: "{{ trix_login_fqdn }}"
      luna_verify_certificate: "{{ luna_verify_certificate }}"
      trix_stream: "{{ trix_stream }}"
      system_arch: "{{ system_arch }}"
      package_arch: "{{ package_arch }}"
      trix_use_openldap: "{{ trix_use_openldap | default(True) }}"
      trix_use_ds389: "{{ trix_use_ds389 | default(False) }}"
      admin_group: "{{ admin_group | default('admins') }}"
      is_airgap: "{{ is_airgap | default(False) }}"
      ag_server: "{{ ag_server | default(trix_ctrl_hostname) }}"
      playbook_done_prior: "{{ playbook_done_prior | default(False) }}"

- name: Create the directory for the facts file
  file:
    name: "{{ trix_facts_file | dirname }}"
    state: directory

- name: Create facts file
  copy:
    dest: "{{ trix_facts_file }}"
    content: "{{ data }}"
    mode: '0600'


