---
# tasks file for resolv

- name: Disable NetworkManager managing /etc/resolv.conf
  ini_file:
    path: /etc/NetworkManager/NetworkManager.conf
    state: present
    no_extra_spaces: yes
    section: main
    option: dns
    value: none
    owner: root
    group: root
    mode: 0644
    backup: yes
  notify: reload NetworkManager

- name: Render /etc/resolv.conf
  template:
    src: "resolv.conf.j2"
    dest: "/etc/resolv.conf"
    backup: "yes"
  notify: reload NetworkManager

- name: Preserve resolv.conf from being overwritten
  copy:
    src: dhclient-enter-hooks
    dest: /etc/dhcp/dhclient-enter-hooks
    mode: 0755
    backup: "yes"

