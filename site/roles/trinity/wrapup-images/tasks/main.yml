---
- block:
  - name: Cleanup the image
    command: yum clean all
    when: ansible_facts['os_family'] == "RedHat"

  - name: Cleanup the image
    command: apt-get clean
    when: ansible_facts['os_family'] == "Debian"

  - name: Cleanup tmp directories 
    command: "rm -f {{ item }}/*"
    with_items:
      - /tmp
      - '{{ trix_tmpdir }}'
    when: 
      - item | length > 0
      - not item in ['/', ' ']

  - name: Create /etc/trinity
    file:
      path: /etc/trinity/
      state: directory

  - name: Set wrap-up flag
    copy:
      content: ""
      dest: /etc/trinity/image.done
      force: false
  when: in_image
  tags: always
