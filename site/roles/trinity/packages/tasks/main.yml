---
# Install additional packages and tunables

- name: Load a variable file based on the OS type, or a default if not found. Using free-form to specify the file.
  include_vars: "{{ item }}"
  with_first_found:
    - "{{ package_arch }}/{{ ansible_distribution }}{{ ansible_distribution_major_version}}.yaml"
    - "{{ package_arch }}/{{ ansible_os_family }}{{ ansible_distribution_major_version}}.yaml"
  no_log: true
  ignore_errors: true

- name: Install additional packages
  yum:
    name: "{{ item }}"
    state: present
    enablerepo:
      - powertools
      - crb
      - codeready-builder-for-rhel-*-x86_64-rpm
      - codeready-builder-for-rhel-*-aarch64-rpm
    disable_gpg_check: true
  with_items: "{{ install_packages }}"
  when: not playbook_done_prior | default(False)
  retries: "{{ rpm_retries | default(3) }}"
  delay: "{{ rpm_delay | default(15) }}"
  tags: install-only

- name: Install additional packages
  dnf:
    name: "{{ install_packages }}"
    state: present
    enablerepo:
      - powertools
      - crb
      - codeready-builder-for-rhel-*-x86_64-rpm
      - codeready-builder-for-rhel-*-aarch64-rpm
    disable_gpg_check: true
  when: playbook_done_prior | default(False)
  retries: "{{ rpm_retries | default(3) }}"
  delay: "{{ rpm_delay | default(15) }}"
  tags: install-only

- name: Enable haveged service
  service:
    name: haveged
    enabled: true

- name: Start haveged service
  service:
    name: haveged
    state: started
  when: not in_image
