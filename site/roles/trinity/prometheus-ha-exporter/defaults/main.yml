---
prometheus_ha_exporter_version: "1.3.3"
prometheus_ha_exporter_binary_url: "https://updates.clustervision.com/trinityx/external/monitoring/prometheus-ha-exporter/{{system_arch}}/binaries/{{trix_stream}}/prometheus-ha-exporter.{{prometheus_ha_exporter_version}}"

prometheus_ha_exporter_web_listen_port: "14205"
prometheus_ha_exporter_web_listen_host: "0.0.0.0"

prometheus_ha_exporter_log_dir: "/var/log/prometheus"

prometheus_ha_exporter_binary_install_dir: "/usr/local/bin"
# Controller-side scratch for the delegated download. trix_tmpdir is only set
# where trinity/init runs (the controller); image plays run init-nodes and do not.
prometheus_ha_exporter_download_dir: "{{ trix_tmpdir | default('/tmp', true) }}"

prometheus_ha_exporter_system_user: "prometheus-ha-exporter"
prometheus_ha_exporter_system_group: "prometheus"
prometheus_ha_exporter_additional_system_groups: []

