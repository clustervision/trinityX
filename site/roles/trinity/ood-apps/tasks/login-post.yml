---
- name: Post login image for OOD installation
  when: in_login_image|default(False)
  block:
    - name: Remove '{{ ood_apps_admin_group }}' group
      group:
        name: '{{ ood_apps_admin_group }}'
        gid: '1050'
        system: 'yes'
        state: absent
      # only the image's local stand-in goes; a live node has the group from LDAP
      when: ood_apps_admin_group != 'root' and not on_node | default(False) | bool
