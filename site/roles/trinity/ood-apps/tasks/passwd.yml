---

- name: Ensure Dashboard directory exists
  file:
    path: /etc/ood/config/apps/dashboard
    state: directory
   
- name: Create env file for passwd
  copy:
    dest: /etc/ood/config/apps/dashboard/env
    content: "OOD_DASHBOARD_PASSWD_URL=/pun/sys/trinity_passwd"

- name: Restart services
  ansible.builtin.systemd:
    name: "{{ passwd_item }}"
    state: restarted
  loop_control:
    loop_var: passwd_item
  # nginx runs on the controller only; on a login node apache2 holds its port
  with_items: "{{ [ood_apache_service_name | default('httpd')] + (['nginx'] if on_controller | default(False) | bool else []) }}"
  when: not in_image

