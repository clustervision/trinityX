---
# tasks file for nfs

- name: Install nfs packages
  yum:
    name: '{{ nfs_packages }}'
    state: present
  retries: "{{ rpm_retries | default(3) }}"
  delay: "{{ rpm_delay | default(15) }}"
  tags: install-only

- name: Enable NFS over RDMA
  set_fact:
    nfs_proto: '{{ "rdma" if nfs_enable_rdma == true else "tcp" }}'

- name: Create {{ nfs_exports_path }} if needed
  file:
    path: '{{ nfs_exports_path }}'
    state: directory

- name: Render nfs_exports based on nfs_exports and nfs_remote_mask info
  set_fact:
    nfs_exports_: "{{ nfs_exports_|d([]) + [item|combine({'disabled': item.disabled|default(False,true),
                                                          'rwhosts':  item.rwhosts|default('',true),
                                                          'type': _type|from_yaml,
                                                          'mountpoint': item.path,
                                                          'path': _path|from_yaml|default(item.path,true)})] }}"
  loop: "{{ nfs_exports }}"
  vars:
      # 'name' is optional in shared_fs_disks (an entry may carry only 'mount'),
      # so the mask must be read attribute-safe or templating aborts the play.
      _mask_names: "{{ nfs_remote_mask | selectattr('name', 'defined') | map(attribute='name') | list }}"
      _mask_mounts: "{{ nfs_remote_mask | selectattr('mount', 'defined') | map(attribute='mount') | list }}"
      _path: |
        {% if nfs_use_mask %}
          {% if item.path in _mask_names or item.path in _mask_mounts %}
            {% for disk in nfs_remote_mask %}
              {% if disk.name | default(none) == item.path or (disk.mount is defined and disk.mount == item.path) %}
                {% if disk["xmount"] is defined and disk["xmount"] %}
                  {{ nfs_prefix_path+item.path }}
                {% else %}
                  {{ item.path }}
                {% endif %}
              {% endif %}
            {% endfor %}
          {% else %}
            {% for disk in nfs_remote_mask %}
              {% if disk.partitions is defined %}
                {% for partition in disk.partitions %}
                  {% if partition["mount"] == item.path %}
                    {% if partition["xmount"] is defined and partition["xmount"] %}
                      {{ nfs_prefix_path+item.path }}
                    {% else %}
                      {{ item.path }}
                    {% endif %}
                  {% endif %}
                {% endfor %}
              {% endif %}
            {% endfor %}
          {% endif %}
        {% else %}
          {{ item.path }}
        {% endif %}
      _type: |
        {% if item.path in _mask_names or item.path in _mask_mounts %}
          {% for disk in nfs_remote_mask %}
            {% if disk.name | default(none) == item.path or (disk.mount is defined and disk.mount == item.path) %}
              {% if disk["type"] is defined and (nfs_use_mask or disk["type"] in ['nfs','lustre','beegfs','mmfs','gpfs','panfs']) %}
                {{ disk["type"] }}
              {% endif %}
            {% endif %}
          {% endfor %}
        {% endif %}

- name: Overwrite nfs_mounts fact
  set_fact:
    new_nfs_exports: "{{ nfs_exports_ }}"
  when:
    - nfs_exports_ | length > 0
    - nfs_exports | length > 0

- name: Overwrite nfs_exports fact
  set_fact:
    new_nfs_exports: "{{ nfs_exports }}"
  when: nfs_exports_ is not defined or nfs_exports_ | length == 0

# --- luna: the same exports as document entries. A fused '*(ro)' options string is
# one client; rwhosts and hosts are one client each. The mountpoint is the entry's
# path, the (masked) export path its source where the two differ.
- name: Describe the exports for luna
  set_fact:
    nfs_luna_entries: "{{ nfs_luna_entries | default([]) + [ {'path': item.mountpoint | default(item.path), 'server': 'controller', 'export': {'clients': _clients | from_json}}
                          | combine({'source': item.path} if item.path != (item.mountpoint | default(item.path)) else {}) ] }}"
  loop: "{{ new_nfs_exports }}"
  loop_control:
    label: '{{ item.path }}'
  vars:
    _clients: >-
      {% set clients = [] %}
      {% set rw = item.rwhosts | default([]) %}{% if rw is string %}{% set rw = rw.split(',') if rw else [] %}{% endif %}
      {% set ro = item.hosts | default([]) %}{% if ro is string %}{% set ro = ro.split(',') if ro else [] %}{% endif %}
      {% for host in rw %}{% if host %}{% set _ = clients.append({'to': host, 'options': nfs_rw_options}) %}{% endif %}{% endfor %}
      {% for host in ro %}{% if host %}{% set _ = clients.append({'to': host, 'options': item.options | default('')}) %}{% endif %}{% endfor %}
      {% set fused = (item.options | default('')) | regex_search('^([^()\\s]+)\\((.*)\\)$', '\\1', '\\2') %}
      {% if not ro and fused and fused | length == 2 %}{% set _ = clients.append({'to': fused[0], 'options': fused[1]}) %}{% endif %}
      {{ clients | to_json }}
  when:
    - item.path is defined
    - not item.disabled | default(False)
    - item.type | default('') not in ['nfs', 'lustre', 'beegfs', 'mmfs', 'gpfs', 'panfs']

- name: Hand the exports to luna when it carries the document
  include_role:
    name: luna/mounts
  vars:
    luna_mounts_entries: '{{ nfs_luna_entries | default([]) }}'

- name: Ensure exported paths exist
  file:
    path: "{{ item.path }}"
    state: directory
  with_items: "{{ new_nfs_exports }}"
  when:
    - item.path is defined 
    - item.type is defined and item.type != 'manual' and item.type != 'nfs'

- name: Setup NFS exports in {{ nfs_exports_path }}
  template:
    src: 'exports.j2'
    dest: '{{ nfs_exports_path }}/trinity.exports'
  when: not luna_mounts_available

# the hand-over: exportfs refuses a directory exported twice, so the file this role
# wrote before Luna took over goes, link and all. Luna's luna.exports carries the same shares
- name: Remove the exports file this role wrote before luna took over
  file:
    path: '{{ item }}'
    state: absent
  loop:
    - '/etc/exports.d/trinity.exports'
    - '{{ nfs_exports_path }}/trinity.exports'
  when: luna_mounts_available

- name: Add link to the exports file in /etc/exports.d
  file:
    src: '{{ nfs_exports_path }}/trinity.exports'
    dest: '/etc/exports.d/trinity.exports'
    state: link
    force: true
    follow: false
  when:
    - not luna_mounts_available
    - nfs_exports_path|string not in '/etc/exports.d'

- name: Render nfsmount.conf configuration file
  template:
    src: 'nfsmount.conf.j2'
    dest: '/etc/nfsmount.conf'

- name: Start and enable nfs server
  ansible.builtin.systemd:
    name: nfs-server
    state: started
    enabled: true
  when: not ha|default(False)

- name: Refresh exportfs
  shell: "exportfs -a"
  ignore_errors: true

- block:
  - name: Create shared directory for data that should survive a failover
    file:
      path: '{{ trix_ha }}/var/lib/nfs'
      state: directory

  - name: Add NFS server pacemaker resource
    pcs_resource:
      name: 'nfs-server'
      resource_class: 'ocf'
      resource_type: 'nfsserver'
      options: 'nfs_shared_infodir="{{ trix_ha }}/var/lib/nfs" meta migration-threshold=3 failure-timeout=120s op monitor interval=47s --group Trinity-stack'
      state: present
    tags: pcs
  when: primary|default(True) and ha|default(False)
    
