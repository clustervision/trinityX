---
# vars file for luna2

luna2_packages:
  - luna2-python
  - luna2-grub2-autofind
#  - luna2-daemon
#  - luna2-cli

required_packages:
  - dhcp-server
  - xinetd
  - sqlite
  - dos2unix
  - tftp-server
  - net-snmp-utils
  # lchroot runs the image build inside a bubblewrap sandbox. It is a BaseOS
  # package on el8/9/10 (so it is already in an airgap mirror), but nothing
  # declared it -- it happened to be present because flatpak pulls it in.
  - bubblewrap

enable_services:
  - xinetd
  - dhcpd
  - nginx

start_services:
  - xinetd
  - nginx

luna2_use_kea: false

# commenting out both next values will use index/repo defaults, i.e. latest, greatest
#
# These name the published '<name>-<major>.<minor>' link, and the publish tree keeps
# one per major.minor side by side: a 2.2 build creates luna2_daemon-2.2... and leaves
# luna2_daemon-2.1... pointing at the last 2.1 build. So the version here decides which
# line a controller installs, and leaving it at 2.1 means 2.2 is published but never
# picked up. Bump these together with the luna2 repositories.
luna2_daemon_pip: luna2_daemon-2.2-py3-none-any.whl
luna2_cli_pip: luna2_cli-2.2-py3-none-any.whl
luna2_utils_pip: luna2_utils-2.2-py3-none-any.whl

luna2_utils:
  # The list is now the whole story: /usr/sbin gets exactly these names. It used
  # to be a grep against a directory listing, so lchroot-legacy was linked purely
  # because it shares a prefix with lchroot -- name it, or the next change to the
  # discovery silently drops it.
  - lchroot
  - lchroot-legacy
  - lcluster
  - lpower
  - bootutil
  - lexport
  - lnode
  - lslurm
  - lrack
  - trinity_diagnosis
  - lmaster
  - lsosreport

luna2_named_include_file: /etc/named.luna.zones
luna2_named_zone_dir: /var/lib/named

luna2_cluster:
  cluster:
    domain_search: 'cluster ib ipmi'
    dns_forwarders:
      - 8.8.8.8
      - 8.8.4.4
  ha: false
  nosharedip: false
  controllers:
    hostnames: 'controller1'
    ip_addresses: '10.141.255.254'
  frontend_address: '10.141.255.254'
  frontend_hostname: 'controller'
  networks:
  - name: 'cluster'
    function: 'default'
    ip: '10.141.0.0'
    prefix: '16'
    start_ip: '10.141.200.1'
    end_ip:  '10.141.210.254'
    type: 'ethernet'
  - name: 'ipmi'
    function: 'bmc'
    ip: '10.148.0.0'
    prefix: '16'
    type: 'ethernet'
  - name: 'ib'
    function: 'low-latency'
    ip: '10.149.0.0'
    prefix: '16'
    type: 'infiniband'

luna2_noarch_pip_repository: "https://updates.clustervision.com/trinityx/{{ trix_version }}/luna2/noarch/pip/{{ trix_stream }}"

luna2_key: CwSQcHNqiLSHXQaCDtAF2414e3muXgmpht6ocVA2xGs=

luna2_aarch64_ipxe_files: "https://updates.clustervision.com/trinityx/{{ trix_version }}/additional/aarch64/ipxe"
luna2_x86_64_ipxe_files: "https://updates.clustervision.com/trinityx/{{ trix_version }}/additional/x86_64/ipxe"

luna2_download_all_arch_ipxe_files: true
