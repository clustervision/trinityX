- name: Create luna.key
  copy:
    dest: "{{ trix_ssl }}/luna.key"
    content: "{{ luna2_key }}"

- debug:
    msg: "{{ luna2_cluster }}"

- block:
  - debug:
      msg: "luna_bmcsetup_password is not defined, generating random password"

  - name: Generate default BMC setup password value
    set_fact:
      luna_bmcsetup_password: "{{ lookup('password', '/dev/null', length=3, chars='ascii_uppercase') +
        lookup('password', '/dev/null', length=6, chars='ascii_lowercase') +
        lookup('password', '/dev/null', length=2, chars='digits') +
        lookup('password', '/dev/null', length=2, chars='_!@#%^.') }}"
  when: (luna_bmcsetup_password is not defined) or luna_bmcsetup_password | length == 0

- block:
  - debug:
      msg: "luna_bmcsetup_user is not defined, using 'admin' as default"

  - name: Setting default bmcsetup user
    set_fact:
      luna_bmcsetup_user: 'admin'
  when: (luna_bmcsetup_user is not defined) or luna_bmcsetup_user | length == 0
- block:
  - debug:
      msg: "luna_redfish_password is not defined, generating random password"
  - name: Generate default Redfish account password value
    set_fact:
      luna_redfish_password: "{{ lookup('password', '/dev/null', length=3, chars='ascii_uppercase') +
        lookup('password', '/dev/null', length=6, chars='ascii_lowercase') +
        lookup('password', '/dev/null', length=2, chars='digits') +
        lookup('password', '/dev/null', length=2, chars='_!@#%^.') }}"
  when: (luna_redfish_password is not defined) or luna_redfish_password | length == 0
- block:
  - debug:
      msg: "luna_redfish_user is not defined, using 'rfadmin' as default"
  - name: Setting default Redfish account user
    set_fact:
      luna_redfish_user: 'rfadmin'
  when: (luna_redfish_user is not defined) or luna_redfish_user | length == 0
- block:
  - debug:
      msg: "luna_redfish_role is not defined, using 'Administrator' as default"
  - name: Setting default Redfish account role
    set_fact:
      luna_redfish_role: 'Administrator'
  when: (luna_redfish_role is not defined) or luna_redfish_role | length == 0

- name: Get installed named minor version
  shell: "named -v 2>&1 | awk '{print $2}' | cut -d. -f2"
  register: luna2_named_minor_raw
  changed_when: false
  failed_when: false

- name: Set BIND_LEGACY fact
  set_fact:
    luna2_bind_legacy: "{{ 'true' if (luna2_named_minor_raw.stdout | trim != '' and (luna2_named_minor_raw.stdout | trim | int) <= 16) else 'false' }}"

