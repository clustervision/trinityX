- name: Render /usr/bin/luna
  template:
    src: 'luna2-cli-wrapper.j2'
    dest: '/usr/bin/luna'
    owner: root
    group: root
    mode: 0755

- name: Ensuring bash completion path exists
  file:
    path: '/etc/bash_completion.d/'
    state: directory
    owner: root
    group: root

- name: Copy bash completion script
  copy:
    remote_src: true
    src: "{{ trix_luna }}/cli/addons/bash_completion.sh"
    dest: '/etc/bash_completion.d/luna.sh'
    owner: root
    group: root
    mode: 0644

# Any luna util shipping a *_completion.sh under its addons directory is picked up
# here, so new tools get bash completion without touching this role. Older utils
# without an addons directory simply yield no matches.
- name: Discover bash completion scripts shipped by luna utils
  find:
    paths: "{{ luna2_python_dir.stdout }}/site-packages/utils/addons"
    patterns: '*_completion.sh'
  register: luna2_utils_completions

- name: Install luna utils bash completion scripts
  copy:
    remote_src: true
    src: "{{ item.path }}"
    dest: "/etc/bash_completion.d/{{ item.path | basename | regex_replace('_completion\\.sh$', '.sh') }}"
    owner: root
    group: root
    mode: 0644
  with_items: "{{ luna2_utils_completions.files }}"
  loop_control:
    label: "{{ item.path | basename }}"

- block:
  - name: Copy tftp configuration to /etc/xinetd.d
    copy:
      src: 'tftp'
      dest: '/etc/xinetd.d/tftp'
    notify: restart xinetd
    when: ansible_facts['distribution_major_version']|int < 9

  - name: Determine tftpboot directory
    set_fact:
      luna2_tftpboot_directory: "{{ '/var/lib/tftpboot' if ansible_facts['distribution_major_version']|int > 8 else '/tftpboot' }}"

  - name: Ensure tftpboot directory exists
    file:
      path: "{{ luna2_tftpboot_directory }}"
      state: directory

  - block:
    - name: Download X86 64-bit iPXE EFI image to tftpboot
      get_url:
        url: "{{ luna2_x86_64_ipxe_files }}/{{ item }}"
        dest: "{{ luna2_tftpboot_directory }}/luna_{{ item }}"
        mode: '0444'
      with_items:
        - ipxe.efi
        - undionly.kpxe
        - snponly.efi
      retries: "{{ rpm_retries | default(3) }}"
      delay: "{{ rpm_delay | default(15) }}"
      tags: install-only
    when: system_arch == "x86_64" or luna2_download_all_arch_ipxe_files|default(False)

  - name: Download ARM 64-bit iPXE EFI image to tftpboot
    get_url:
      url: "{{ luna2_aarch64_ipxe_files }}/{{ item }}"
      dest: "{{ luna2_tftpboot_directory }}/luna_{{ item | split('.') | first }}_arm64.efi"
      mode: '0444'
    with_items:
      - ipxe.efi
      - snponly.efi
    retries: "{{ rpm_retries | default(3) }}"
    delay: "{{ rpm_delay | default(15) }}"
    when: system_arch == "aarch64" or luna2_download_all_arch_ipxe_files|default(False)
    tags: install-only
  when: ansible_facts['os_family'] == "RedHat"

