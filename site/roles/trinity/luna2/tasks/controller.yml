---
# tasks file for luna

- name: Load kea variable file
  include_vars: "kea.yaml"
  ignore_errors: true
  when: luna2_use_kea | default(False)

- name: Load a variable file based on the OS type, or a default if not found. Using free-form to specify the file
  include_vars: "{{ item }}"
  with_first_found:
    - "{{ ansible_distribution }}{{ ansible_distribution_major_version}}.yaml"
    - "{{ ansible_os_family }}{{ ansible_distribution_major_version}}.yaml"
    - "{{ ansible_distribution }}.yaml"
    - "{{ ansible_os_family }}.yaml"
  no_log: true
  ignore_errors: true

- name: Load airgap variables
  include_vars: "airgap/main.yaml"
  when: is_airgap | default(False)

- name: Install luna2 packages
  yum:
    name: '{{ luna2_packages }}'
    state: present
    enablerepo: luna2
  retries: "{{ rpm_retries | default(3) }}"
  delay: "{{ rpm_delay | default(15) }}"
  tags: install-only

- name: Install required packages
  yum:
    name: '{{ luna2_common_packages + luna2_os_packages }}'
    state: present
  retries: "{{ rpm_retries | default(3) }}"
  delay: "{{ rpm_delay | default(15) }}"
  tags: install-only

- name: Ensure /var/log/luna exists
  file:
    path: '/var/log/luna'
    state: directory

- name: Include logrotate
  include_role:
    name: trinity/logrotate
  vars:
    logrotate_component: 'luna'

- name: Ensure files directory exists
  file:
    path: '{{ trix_luna }}/files'
    state: directory

# ----------------- stop if we exist -----------------

- name: Populate service facts
  service_facts:

- name: Stop luna daemon
  ansible.builtin.systemd:
    name: luna2-daemon
    state: stopped
  when: ansible_facts.services['luna2-daemon.service'] is defined and ansible_facts.services['luna2-daemon.service'].status != 'not-found'

# ----------------------------------------------------

# -------  destroy existing DB if requested ----------

- block:
  - block:
    - name: set DB path
      set_fact:
        luna_daemon_db_path: '{{ trix_luna }}/daemon/common/luna.db'

    - name: Verifying for data existence
      stat:
        path: '{{ luna_daemon_db_path }}'
      register: luna_daemon_db_file

  - block:
    - name: Verifying previous data backup existence
      stat:
        path: '{{ luna_daemon_db_path }}.backup'
      register: luna_daemon_db_backup

    - name: Deleting previous data backup
      file:
        path: '{{ luna_daemon_db_path }}.backup'
        state: absent
      when:
        - luna_daemon_db_backup.stat.exists

    - name: Moving current data to backup
      command: 'mv -f {{ luna_daemon_db_path }} {{ luna_daemon_db_path }}.backup'
    when:
      - luna_daemon_db_file.stat.exists
  when:
    - override | default(False)
    - primary | default(True)

