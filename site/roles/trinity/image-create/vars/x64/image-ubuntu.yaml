---

#ubuntu_distribution_source: https://ftp.nluug.nl/pub/os/Linux/distr/ubuntu/
ubuntu_distribution_source: https://ftp.snt.utwente.nl/pub/os/linux/ubuntu/

# Ubuntu release selection. Pass -e ubuntu_version=24.04 (or 22.04 / 26.04) to pick
# one; the codename is looked up here so nobody has to remember it. Passing
# -e ubuntu_distribution_release=<codename> directly still works and wins, which is
# how a release not listed here gets built without editing this file.
#
# 22.04 and 24.04 default to initramfs-tools; 26.04 defaults to dracut. The luna2
# client ships both and the daemon packs with whichever the image has, so changing
# this line is all that is needed.
ubuntu_releases:
  "22.04": jammy
  "24.04": noble
  "26.04": resolute
ubuntu_version: "22.04"
ubuntu_distribution_release: "{{ ubuntu_releases[ubuntu_version] | default('jammy') }}"

image_core_packages:                                                                                                                                                                         
  - shim-signed           # lpart: signed UEFI shim, staged by lpart-bootloader-finalise
  - grub-efi-amd64-signed # lpart: signed grub for the ESP EFI/<distro>/ pair
  - grub-efi-amd64        # lpart: grub-install/update-grub toolchain in the image
  - python3
  - mc
  - e2fsprogs
  - xfsprogs
  - dosfstools
  - net-tools
  - tar
  - bzip2
  - lbzip2
  - parted
  - gpg
  - ipmitool
  - linux-image-generic
  - ssh
  - curl
  - less
  - aria2
  - vim
  - coreutils
  - tpm2-tools
  - grepcidr
  - iputils-ping
  - netplan.io
  - dosfstools
  - efibootmgr
  - rsync
  - mdadm
  - fdisk
  - lsscsi
  - pciutils
  - parted
  - gdisk
  - jq
  - lvm2
  - thin-provisioning-tools
  - tpm-udev
  - libtpm2-pkcs11-1
  - tpm2-tools

luna2_client_package: "{{ trix_repo_baseurl }}/{{ trix_version }}/luna2/ubuntu/{{ system_arch }}/luna2-client.deb"
