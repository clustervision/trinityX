---

required_packages:
  - "debootstrap"
  - "zstd"

ubuntu_distribution_source: https://ports.ubuntu.com/

# Ubuntu release selection. Pass -e ubuntu_version=24.04 (or 22.04 / 26.04) to pick
# one; the codename is looked up here so nobody has to remember it. Passing
# -e ubuntu_distribution_release=<codename> directly still works and wins, which is
# how a release not listed here gets built without editing this file.
#
# 22.04 and 24.04 default to initramfs-tools; 26.04 defaults to dracut. The luna2
# client ships both and the daemon packs with whichever the image has, so changing
# this line is all that is needed.
ubuntu_releases:
  "22.04": jammy
  "24.04": noble
  "26.04": resolute
ubuntu_version: "22.04"
ubuntu_distribution_release: "{{ ubuntu_releases[ubuntu_version] | default('jammy') }}"

image_core_packages:
  - python3
  - mc
  - e2fsprogs
  - xfsprogs
  - net-tools
  - tar
  - bzip2
  - lbzip2
  - parted
  - gpg
  - ipmitool
  - linux-image-generic
  - ssh
  - curl
  - less
  - aria2
  - vim
  - coreutils
  - tpm2-tools
  - grepcidr
  - iputils-ping
  - netplan.io
  - dosfstools
  - efibootmgr
  - rsync
  - lshw

luna2_client_package: "https://updates.clustervision.com/trinityx/{{ trix_version }}/luna2/noarch/deb/luna2-client.deb"                                                                      
 
