---

# lpart / RHEL-178642 -- pin the openssl stack away from the asn1_d2i_read_bio regression
# in openssl-libs-3.5.5-5.el9_8 (full analysis in the "Pin packages in the image" task in
# tasks/redhat/extend.yml). EL9 ONLY.
#
# The effective EL version of the IMAGE, evaluated on the CONTROLLER (image-create base +
# extend run there, so ansible_distribution_major_version is the CONTROLLER version, not
# the image one). A cross-major build sets image_el_releasever (8 / 10); a native build
# leaves it unset and the image is the controller major. Keying off this -- rather than
# off the controller facts -- is what keeps rocky8/rocky10 (which are built ON an el9
# controller) correctly UNPINNED.
image_el_effective_version: "{{ image_el_releasever | default(ansible_distribution_major_version) | string }}"
image_package_pins: "{{ ['openssl-libs-3.5.5-4.el9_8'] if image_el_effective_version == '9' else [] }}"
image_dnf_excludes: "{{ ['openssl-3.5.5-5.el9_8*', 'openssl-libs-3.5.5-5.el9_8*', 'openssl-fips-provider-3.5.5-5.el9_8*'] if image_el_effective_version == '9' else [] }}"


# lpart/offline-repo: base URL of the ClusterVision-published TrinityX layer
# (trix / luna2 / additional / slurm / monitoring). Default = upstream, so stock
# behaviour is unchanged. Point it at a local mirror to build without depending on
# updates.clustervision.com being reachable (see offline-repo/ in the lpart installer):
#   -e trix_repo_baseurl=http://<controller>:7060/trinityx
trix_repo_baseurl: "https://updates.clustervision.com/trinityx"
trinityx_repositories:
  - name: trix
    repo: "{{ trix_repo_baseurl }}/{{ trix_version }}/os/{{ ansible_distribution|lower }}/{{ ansible_distribution_major_version }}/{{ system_arch }}"
    gpgcheck: False
  - name: luna2
    repo: "{{ trix_repo_baseurl }}/{{ trix_version }}/luna2/{{ ansible_distribution|lower }}/{{ ansible_distribution_major_version }}/{{ system_arch }}"
    gpgcheck: False
  - name: luna2-noarch
    repo: "{{ trix_repo_baseurl }}/{{ trix_version }}/luna2/noarch/rpms"
    gpgcheck: False

image_core_packages:
  - "@core"
  - "kernel"
  - "grub2"
  - "grub2-tools"
  - "grub2-efi-x64"
  - "grub2-efi-x64-modules"
  - "tzdata"
  - "bind-utils"
  - "shim-x64"
  - "efibootmgr"
  - "dosfstools"
  - "lvm2"
  - "mdadm"
  - "lbzip2"
  - "aria2"
  - "tpm2-tools"
  - "dmidecode"
  - "parted"
  - "util-linux"
  - "luna2-client"

dracut_extras:
  - "/usr/sbin/mkswap"
  - "/usr/sbin/swapon"
  - "/usr/sbin/swaplabel"
  - "/usr/sbin/mkfs.vfat"
  - "/usr/sbin/mkfs.fat"
  - "/usr/sbin/mkdosfs"
  - "/usr/sbin/dosfslabel"
  - "/usr/sbin/fatlabel"
  - "/etc/mke2fs.conf" # https://bugzilla.redhat.com/show_bug.cgi?id=1893750
  - "/usr/sbin/mdadm"
  - "/usr/bin/top"
  - "/usr/sbin/fdisk"
  - "/usr/sbin/lspci"
  - "/usr/share/hwdata/pci.ids"
  - "/usr/bin/lsblk"
  - "/usr/bin/lsscsi"
  - "/usr/bin/tee"
  - "/usr/bin/lbzip2"
  - "/usr/bin/tpm2_pcrread"
  - "/usr/bin/aria2c"
  - "/usr/sbin/parted"
  - "/usr/bin/mount"
  - "/usr/sbin/dmidecode"
  - "/usr/sbin/partprobe"
  - "/usr/sbin/wipefs"

image_reinstall_packages: []
image_remove_packages: []

# lpart: chroot command prefix for in-image shell tasks. Default = native
# chroot; lchroot(bwrap) targets override via -e image_chroot_cmd (build-image.sh).
image_chroot_cmd: "chroot {{ image_path }}"

# Ubuntu release selection. Pass -e ubuntu_version=22 (or 26) to pick one; the
# codename is looked up here so nobody has to remember it. Passing
# -e ubuntu_distribution_release=<codename> directly still works and wins, which is
# how a release not listed here gets built without editing this file.
#
# 22 and 24 default to initramfs-tools; 26 defaults to dracut. The luna2 client
# ships both and the daemon packs with whichever the image has, so changing this
# line is all that is needed.
#
# The *-ubuntu.yml playbooks declare their own default and pass it in, so this
# value only applies when the role is used outside them. Keep the two in step.
ubuntu_releases:
  "22": jammy
  "24": noble
  "26": resolute
ubuntu_version: "24"
ubuntu_distribution_release: "{{ ubuntu_releases[ubuntu_version] | default('noble') }}"
