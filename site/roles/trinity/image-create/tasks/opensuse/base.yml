- name: Prepare zypper to work
  block:
  - name: Running shell commands inside image
    shell: "{{ image_chroot_cmd }} {{ item }}"
    # image_proc_mount=false under lchroot(bwrap), which already provides /proc; the
    # explicit mount/umount (which unprivileged bwrap cannot do) are dropped from the list.
    with_items: "{{ (['mount proc -t proc /proc'] if image_proc_mount | default(True) | bool else []) + ['/usr/sbin/update-ca-certificates', 'rpm --import /etc/pki/rpm-gpg/RPM-GPG-KEY-openSUSE', 'zypper rr opensuse', 'zypper ar /etc/yum.repos.d/opensuse.repo', 'zypper --gpg-auto-import-keys refresh', 'zypper up --replacefiles --no-confirm'] + (['umount /proc'] if image_proc_mount | default(True) | bool else []) }}"
    retries: 1
    delay: 10
  rescue:
  - name: Tasks in image before leaving playbook
    shell: "{{ image_chroot_cmd }} {{ item }}"
    with_items: "{{ ['umount /proc'] if image_proc_mount | default(True) | bool else [] }}"

- name: Create base opensuse OS
  shell: "{{ image_chroot_cmd }} zypper --non-interactive in -t pattern base && {{ image_chroot_cmd }} zypper --non-interactive install --no-recommends python3"

