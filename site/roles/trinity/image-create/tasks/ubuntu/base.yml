---
- name: Load a variable file based on the OS type, or a default if not found. Using free-form to specify the file.
  include_vars: "{{ package_arch }}/image-{{ image_create_distribution }}.yaml"
  no_log: true
  ignore_errors: true

- name: Install required packages
  yum:
    name: "{{ required_packages }}"
    state: present
  retries: "{{ rpm_retries | default(3) }}"
  delay: "{{ rpm_delay | default(15) }}"
  tags: install-only

- name: Gather debootstrap version
  shell: "debootstrap --version | awk '{print $2}'"
  register: debootstrap_version

- name: Copy missing debootstrap files if they don't exist
  copy:
    src: "files/ubuntu/{{ item }}"
    dest: "/usr/share/debootstrap/scripts/"
    mode: 0755
  with_items:
    - focal
    - jammy
    - noble
  when: debootstrap_version.stdout.startswith('1.0.136') or debootstrap_version.stdout.startswith('1.0.137')

- name: Check whether debootstrap knows the requested release
  stat:
    path: "/usr/share/debootstrap/scripts/{{ ubuntu_distribution_release }}"
  register: debootstrap_release_script

- name: Copy the debootstrap script for a release the installed debootstrap predates
  copy:
    src: "files/ubuntu/{{ ubuntu_distribution_release }}"
    dest: "/usr/share/debootstrap/scripts/"
    mode: 0755
  when: not debootstrap_release_script.stat.exists


- name: Build basic Ubuntu image
  shell: "debootstrap --variant=buildd {{ image_debootstrap_flags | default('') }} {{ ubuntu_distribution_release }} {{ image_path }} {{ ubuntu_distribution_source }} | tee {{ trix_tmpdir }}/debootstrap.log"
  retries: 10
  delay: 15
  register: ubuntu_base_image_result
  until: ubuntu_base_image_result.rc == 0

- name: Verify logs
  shell: "grep 'E:' {{ trix_tmpdir }}/debootstrap.log | grep -v 'Tried to extract package' > /dev/null && echo fail || true"
  register: ubuntu_base_image_verify

- name: Verify build
  fail:
    msg: "Ubuntu basic image build failed. please rerun playbook or look at {{ trix_tmpdir }}/debootstrap.log"
  when: ubuntu_base_image_verify.stdout == 'fail'

- name: Second-stage the foreign-arch debootstrap (in-image, binfmt emulation)
  # container=mmdebstrap-unshare (lowercase, the systemd convention detect_container reads) takes debootstrap's designed container path:
  # check_sane_mount's mknod/bind probe cannot work in the bwrap sandbox
  # (CAP_MKNOD dropped) and would false-report noexec. No tee pipe: rc must be
  # debootstrap's own (a pipe masked the first failure with tee's rc 0).
  shell: "{{ image_chroot_cmd }} env container=mmdebstrap-unshare /debootstrap/debootstrap --second-stage >> {{ trix_tmpdir }}/debootstrap.log 2>&1"
  when: image_debootstrap_flags is defined and '--foreign' in image_debootstrap_flags
  register: ubuntu_second_stage_result
  retries: 2
  delay: 10
  until: ubuntu_second_stage_result.rc == 0

- name: Pin flash-kernel out of the image (foreign-arch build)
  # flash-kernel manages on-board boot media of ARM SBCs; in a netboot
  # compute image it is useless, and its postinst cannot identify a board
  # inside the build sandbox ('Unsupported platform') -- it poisoned the
  # whole dpkg configure chain. Pin BEFORE any apt run so it never installs.
  copy:
    dest: "{{ image_path }}/etc/apt/preferences.d/no-flash-kernel"
    content: |
      Package: flash-kernel
      Pin: release *
      Pin-Priority: -1
  when: image_debootstrap_flags is defined and '--foreign' in image_debootstrap_flags

- name: Create {{ image_path }}/dev
  file:
    path: "{{ image_path }}/dev/"
    state: directory
    mode: 0755
    owner: root
    group: root

- name: Create basic /dev files
  command: "/usr/bin/mknod {{ image_path }}/dev/{{ item.dev }} {{ item.t }} {{ item.ma }} {{ item.mi }} creates={{ image_path }}/dev/{{ item.dev }}"
  args:
    creates: "{{ image_path }}/dev/{{ item.dev }}"
  with_items:
    - {dev: "null", mo: "666", t: 'c', ma: 1, mi: 3}  # device, mode, type, major, minor
    - {dev: "zero", mo: "666", t: 'c', ma: 1, mi: 5}
    - {dev: "random", mo: "666", t: 'c', ma: 1, mi: 8}
    - {dev: "urandom", mo: "666", t: 'c', ma: 1, mi: 9}
    - {dev: "console", mo: "600", t: 'c', ma: 5, mi: 1}
    - {dev: "ptmx", mo: "666", t: 'c', ma: 5, mi: 2}
    - {dev: "tty", mo: "666", t: 'c', ma: 5, mi: 0}

  # seen in the field where /dev/null had wrong permissions for unknown reasons. apt will fail.
- name: Ensure /dev/null is world writeable
  file:
    path: "{{ image_path }}/dev/null"
    mode: "0666"

- name: Install bootstrap packages in {{ image_path }}
  block:
  - name: Running apt-get inside image
    shell: "{{ image_chroot_cmd }} {{ item }}"
    # Ubuntu 26 ships rust coreutils, which abort without /proc in the chroot;
    # image_proc_mount=false under lchroot(bwrap), which already provides /proc; the
    # explicit mount/umount (which unprivileged bwrap cannot do) are dropped from the list.
    with_items: "{{ (['mount proc -t proc /proc'] if image_proc_mount | default(True) | bool else []) + ['apt-get install -y python3'] + (['umount /proc'] if image_proc_mount | default(True) | bool else []) }}"
  rescue:
  - name: Tasks in image before leaving playbook
    shell: "{{ image_chroot_cmd }} {{ item }}"
    with_items: "{{ ['umount /proc'] if image_proc_mount | default(True) | bool else [] }}"
  - name: Fail the build after unmounting
    fail:
      msg: "Bootstrap package install failed in {{ image_path }}. See the apt output above."
  tags: install-only
