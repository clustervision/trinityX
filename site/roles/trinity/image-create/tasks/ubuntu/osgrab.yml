---
- name: Load a variable file based on the OS type, or a default if not found. Using free-form to specify the file.
  include_vars: "{{ package_arch }}/image-{{ image_create_distribution }}.yaml"
  no_log: true
  ignore_errors: true

- name: Configure repos
  lineinfile:
    path: "/etc/apt/sources.list"
    line: "deb {{ ubuntu_distribution_source }} {{ ubuntu_distribution_release }} main universe"
    state: present
    create: 'yes'

- name: Updating Apt
  shell: "apt-get update"
  ignore_errors: true
  when: image_update_packages|default(True)

- name: Install core packages - @core, kernel and grub2
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
  with_items: "{{ image_core_packages }}"
  when: not playbook_done_prior | default(False)
  retries: "{{ rpm_retries | default(3) }}"
  delay: "{{ rpm_delay | default(15) }}"
  tags: install-only

- name: Install core packages - @core, kernel and grub2
  ansible.builtin.apt:
    name: "{{ image_core_packages }}"
    state: present
  when: playbook_done_prior | default(False)
  retries: "{{ rpm_retries | default(3) }}"
  delay: "{{ rpm_delay | default(15) }}"
  tags: install-only

- name: Download luna2-client package
  get_url:
    url: "{{ luna2_client_package }}"
    dest: "/tmp/{{ luna2_client_package|split('/')|last }}"
  tags: install-only
#    validate_certs: false

- name: install luna2-client package
  shell: "dpkg --force-architecture -i /tmp/{{ luna2_client_package|split('/')|last }}"

- name: Disable unwanted/unneeded services
  service:
    name: "{{ item }}"
    enabled: false
  with_items:
    - tinysshd
  ignore_errors: true

# The SSSD responders are listed in the 'services =' line of sssd.conf (in-process
# responders), so the socket-activation units conflict and fail at boot with
# "configured to be socket-activated but still mentioned in the services line"
# (exit 17), which trips the ServiceFailedSystemdGeneric alert. 'enabled: false' is
# not enough: it omits sssd-pam-priv.socket, does not take effect in the image chroot,
# is re-asserted by the package preset, and a disabled-but-failed unit still alerts.
# Mask all three responder sockets via a /dev/null symlink so systemd can never start
# them (chroot-safe, survives into the booted image, cannot be re-enabled by preset).
- name: Mask conflicting socket-activated SSSD responders
  ansible.builtin.file:
    src: /dev/null
    dest: "/etc/systemd/system/{{ item }}"
    state: link
    force: true
  with_items:
    - sssd-nss.socket
    - sssd-pam.socket
    - sssd-pam-priv.socket

