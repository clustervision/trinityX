---
- name: Load a variable file based on the OS type, or a default if not found. Using free-form to specify the file.
  include_vars: "{{ package_arch }}/image-{{ image_create_distribution }}.yaml"
  no_log: true
  ignore_errors: true

- name: Configure repos
  lineinfile:
    path: "/etc/apt/sources.list"
    line: "deb {{ ubuntu_distribution_source }} {{ ubuntu_distribution_release }} main universe"
    state: present
    create: 'yes'

- name: Updating Apt
  shell: "apt-get update"
  ignore_errors: true
  when: image_update_packages|default(True)

- name: Install core packages - @core, kernel and grub2
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
  with_items: "{{ image_core_packages }}"
  when: not playbook_done_prior | default(False)
  retries: "{{ rpm_retries | default(3) }}"
  delay: "{{ rpm_delay | default(15) }}"
  tags: install-only

- name: Install core packages - @core, kernel and grub2
  ansible.builtin.apt:
    name: "{{ image_core_packages }}"
    state: present
  when: playbook_done_prior | default(False)
  retries: "{{ rpm_retries | default(3) }}"
  delay: "{{ rpm_delay | default(15) }}"
  tags: install-only

- name: Download luna2-client package
  get_url:
    url: "{{ luna2_client_package }}"
    dest: "/tmp/{{ luna2_client_package|split('/')|last }}"
  tags: install-only
#    validate_certs: false

- name: install luna2-client package
  shell: "dpkg --force-architecture -i /tmp/{{ luna2_client_package|split('/')|last }}"

- name: Disable unwanted/unneeded services
  service:
    name: "{{ item }}"
    enabled: false
  with_items:
    - tinysshd
    - sssd-pam.socket
    - sssd-nss.socket
  ignore_errors: true

