---
- name: Load a variable file based on the OS type, or a default if not found. Using free-form to specify the file.
  include_vars: "{{ package_arch }}/image-{{ image_create_distribution }}.yaml"
  no_log: true
  ignore_errors: true

- name: Install dnf-utils
  dnf:
    disable_gpg_check: true
    name: dnf-utils
    state: present
  retries: "{{ rpm_retries | default(3) }}"
  delay: "{{ rpm_delay | default(15) }}"
  tags: install-only

- name: Check OS release on controller
  shell: "rpm -qf /etc/os-release --qf '%{NAME}\n' | sort | uniq | tail -n1"
  register: os_release_rpm
  changed_when: false

- name: Copy local dnf.conf
  copy:
    remote_src: true
    src: "/etc/dnf/dnf.conf"
    dest: "{{ image_path }}/etc/dnf/"

- name: Copy local dnf variables
  copy:
    remote_src: true
    src: "/etc/dnf/vars"
    dest: "{{ image_path }}/etc/dnf/"

##
## The new releasever option in the dnf module actually doesn't do anything...
## Workaround until it's fixed.
##

- name: Create dnf base directory
  file:
    path: "{{ image_path }}/etc/dnf/vars/"
    state: directory
  when: ansible_distribution == "RedHat"

- name: Add releasever variable
  copy:
    content: "{{ ansible_distribution_major_version }}"
    dest: "{{ image_path }}/etc/dnf/vars/releasever"
  when: ansible_distribution == "CentOS"

- name: Touch config files for RedHat
  file:
    path: "{{ item }}"
    state: touch
  with_items:
    - /etc/sysconfig/network
    - /etc/resolv.conf
  when: ansible_distribution == "RedHat"

# Optional cross-major EL bootstrap (e.g. el9 controller -> el10 image): install
# the target release from the target mirror into the image and pin its releasever,
# instead of the controller's release rpm. Mirrors the opensuse base.yml
# dnf --installroot bootstrap (repo lives on the CONTROLLER so the controller's
# dnf resolves it; the image then carries el10 repos via rocky-repos). Off unless
# -e image_el_baseurl=<mirror> -e image_el_releasever=<N> are set.
- name: Seed a cross-major EL base into {{ image_path }}
  when: image_el_baseurl is defined
  block:
    - name: Add the el-bootstrap repo on the controller (disabled by default)
      copy:
        dest: "/etc/yum.repos.d/el-bootstrap-{{ image_el_releasever }}{{ ('-' ~ image_arch) if image_arch is defined else '' }}.repo"
        content: |
          [el-bootstrap-{{ image_el_releasever }}{{ ('-' ~ image_arch) if image_arch is defined else '' }}-baseos]
          name=el-bootstrap {{ image_el_releasever }} BaseOS
          baseurl={{ image_el_baseurl }}/BaseOS/{{ image_arch | default(system_arch) }}/os/
          gpgcheck=0
          enabled=0
          [el-bootstrap-{{ image_el_releasever }}{{ ('-' ~ image_arch) if image_arch is defined else '' }}-appstream]
          name=el-bootstrap {{ image_el_releasever }} AppStream
          baseurl={{ image_el_baseurl }}/AppStream/{{ image_arch | default(system_arch) }}/os/
          gpgcheck=0
          enabled=0
    - name: Pin the target releasever in the image
      file: { path: "{{ image_path }}/etc/dnf/vars", state: directory }
    - copy: { content: "{{ image_el_releasever }}", dest: "{{ image_path }}/etc/dnf/vars/releasever" }
    - name: Install the target release into the image from el-bootstrap
      when: image_arch is not defined
      dnf:
        name: [rocky-release, rocky-repos, rocky-gpg-keys, python3]
        installroot: "{{ image_path }}"
        releasever: "{{ image_el_releasever }}"
        disablerepo: "*"
        enablerepo: "el-bootstrap-{{ image_el_releasever }}-*"
        disable_gpg_check: true
        state: present
      retries: "{{ rpm_retries | default(3) }}"
      delay: "{{ rpm_delay | default(15) }}"
    - name: Install the target release into the image (foreign arch, dnf --forcearch)
      when: image_arch is defined
      shell: >
        dnf -y --installroot={{ image_path }} --forcearch={{ image_arch }}
        --releasever={{ image_el_releasever }} --setopt=reposdir=/etc/yum.repos.d
        --disablerepo=* --enablerepo=el-bootstrap-{{ image_el_releasever }}{{ ('-' ~ image_arch) if image_arch is defined else '' }}-*
        --nogpgcheck --setopt=install_weak_deps=False
        {{ image_dnf_excludes | default([]) | map('regex_replace', '^', '--exclude=') | join(' ') }}
        install rocky-release rocky-repos rocky-gpg-keys python3
      register: el_forcearch_seed
      retries: "{{ rpm_retries | default(3) }}"
      delay: "{{ rpm_delay | default(15) }}"
      until: el_forcearch_seed.rc == 0
    - name: Pin the image arch in the installroot dnf vars (foreign arch)
      when: image_arch is defined
      copy: { content: "{{ image_arch }}", dest: "{{ image_path }}/etc/dnf/vars/{{ item }}" }
      with_items: [arch, basearch]
    - name: Relax rpm arch checks for the cross-arch installroot (foreign arch)
      when: image_arch is defined
      lineinfile:
        path: "{{ image_path }}/etc/dnf/dnf.conf"
        line: "ignorearch=1"
        insertafter: '^\[main\]'
        create: true

- name: Install {{ os_release_rpm.stdout }} package in {{ image_path }}
  when: image_el_baseurl is not defined
  dnf:
    disable_gpg_check: true
    name: "{{ os_release_rpm.stdout }}"
    installroot: "{{ image_path }}"
    state: present
  retries: "{{ rpm_retries | default(3) }}"
  delay: "{{ rpm_delay | default(15) }}"
  tags: install-only

- name: Install dnf package in {{ image_path }}
  when: image_arch is not defined
  dnf:
    disable_gpg_check: true
    name:
      - yum
      - dnf
    installroot: "{{ image_path }}"
    state: present
  retries: "{{ rpm_retries | default(3) }}"
  delay: "{{ rpm_delay | default(15) }}"
  tags: install-only

- name: Install dnf package in {{ image_path }} (foreign arch, dnf --forcearch)
  when: image_arch is defined
  shell: >
    dnf -y --installroot={{ image_path }} --forcearch={{ image_arch }}
    --setopt=reposdir=/etc/yum.repos.d
    --disablerepo=* --enablerepo=el-bootstrap-{{ image_el_releasever }}-{{ image_arch }}-*
    --nogpgcheck --setopt=install_weak_deps=False install dnf
  register: dnf_forcearch_install
  retries: 3
  delay: 15
  until: dnf_forcearch_install.rc == 0

#- synchronize:
#    src: "/etc/pki/"
#    dest: "{{ image_path }}/etc/pki/"
#  when: ansible_distribution == "RedHat"

- name: Create {{ image_path }}/dev
  file:
    path: "{{ image_path }}/dev/"
    state: directory
    mode: 0755
    owner: root
    group: root

- name: Create basic /dev files
  # test -c, not creates: a bootstrap can pre-create these as REGULAR files
  # (seen: /dev/null as an 86-byte ASCII file in built images), and creates=
  # then skips mknod forever. Runtime is unaffected (devtmpfs shadows it) but
  # every chroot/lchroot-context user gets a broken /dev/null.
  shell: |
    test -c {{ image_path }}/dev/{{ item.dev }} || {
      rm -f {{ image_path }}/dev/{{ item.dev }}
      /usr/bin/mknod -m {{ item.mo }} {{ image_path }}/dev/{{ item.dev }} {{ item.t }} {{ item.ma }} {{ item.mi }}
    }
  with_items:
    - {dev: "null", mo: "666", t: 'c', ma: 1, mi: 3}  # device, mode, type, major, minor
    - {dev: "zero", mo: "666", t: 'c', ma: 1, mi: 5}
    - {dev: "random", mo: "666", t: 'c', ma: 1, mi: 8}
    - {dev: "urandom", mo: "666", t: 'c', ma: 1, mi: 9}
    - {dev: "console", mo: "600", t: 'c', ma: 5, mi: 1}
    - {dev: "ptmx", mo: "666", t: 'c', ma: 5, mi: 2}
    - {dev: "tty", mo: "666", t: 'c', ma: 5, mi: 0}

