---
##### New tasks file for ood-portal (3.0 on RockyLinux-8)

- name: Load a variable file based on the OS type, or a default if not found. Using free-form to specify the file.
  include_vars: "{{ item }}"
  with_first_found:
    - "{{ ansible_distribution }}{{ ansible_distribution_version}}.yaml"
    - "{{ ansible_os_family }}{{ ansible_distribution_version}}.yaml"
    - "{{ ansible_distribution }}{{ ansible_distribution_major_version}}.yaml"
    - "{{ ansible_os_family }}{{ ansible_distribution_major_version}}.yaml"
  no_log: true
  ignore_errors: true

- name: Load a variable file based on the OS type, or a default if not found. Using free-form to specify the file. Airgap.
  include_vars: "{{ item }}"
  with_first_found:
    - "airgap/{{ ansible_distribution }}{{ ansible_distribution_version}}.yaml"
    - "airgap/{{ ansible_os_family }}{{ ansible_distribution_version}}.yaml"
    - "airgap/{{ ansible_distribution }}{{ ansible_distribution_major_version}}.yaml"
    - "airgap/{{ ansible_os_family }}{{ ansible_distribution_major_version}}.yaml"
    - "airgap/{{ ansible_distribution }}.yaml"
    - "airgap/{{ ansible_os_family }}.yaml"
    - "airgap/main.yaml"
  no_log: true
  ignore_errors: true
  when: is_airgap | default(False)

# The OS minor decides which Open OnDemand release can run at all, and dnf
# reports a missing module stream far too late to be recognisable. Refuse here.
#
# Rolling releases report no minor at all -- CentOS Stream 9 is version "9" --
# and they run ahead of the point releases rather than behind them, so a minor
# floor cannot be applied to them and must not be guessed at either.
- name: Verify this OS version can run an Open OnDemand release
  ansible.builtin.assert:
    that:
      - ansible_distribution_version is version(ood_os_minimum_versions[ansible_distribution_major_version], '>=')
    fail_msg: >-
      Open OnDemand is not supported on {{ ansible_distribution }} {{ ansible_distribution_version }}:
      no Open OnDemand release TrinityX ships can run on it. The oldest supported minor for
      {{ ansible_distribution }} {{ ansible_distribution_major_version }} is
      {{ ood_os_minimum_versions[ansible_distribution_major_version] }}. Set enable_ood to false to
      install TrinityX without the web portal.
    success_msg: "Open OnDemand {{ ood_release }} on {{ ansible_distribution }} {{ ansible_distribution_version }}"
  when:
    - ansible_os_family == "RedHat"
    - ansible_distribution_major_version in ood_os_minimum_versions
    - ansible_distribution_version != ansible_distribution_major_version

# The release RPM URL is written out for the airgap build to harvest, so it can
# drift from ood_release, which is what decides the module streams.
- name: Verify the Open OnDemand repository matches the release being installed
  ansible.builtin.assert:
    that:
      - _ood_web_releases | difference([ood_release]) | length == 0
    fail_msg: >-
      ood_release is {{ ood_release }} but ood_packages points at Open OnDemand
      {{ _ood_web_releases | join(', ') }}. The repository and the nodejs/ruby module streams
      would not match, and the ondemand packages cannot resolve.
  vars:
    _ood_web_releases: "{{ ood_packages | to_json | regex_findall('ondemand/([0-9.]+)/ondemand-release-web') | unique }}"
  when: ansible_os_family == "RedHat"

# ---- when using DS389
- block:
  - name: Generate ds389 root password and save it to /etc/trinity/passwords
    set_fact:
      tmp_pwd: "{{ lookup('password',
                          '/etc/trinity/passwords/ds389/root.txt
                           chars=ascii_letters,digits,hexdigits') }}"

  - name: Get ds389 root password from /etc/trinity/passwords
    set_fact:
      ds389_root_pwd: "{{ lookup('password',
                          '/etc/trinity/passwords/ds389/root.txt
                           chars=ascii_letters,digits,hexdigits') }}"
  when: ood_use_ds389 | default(False)
# ----

- name: Include repos
  include_role:
    name: trinity/repos
  vars:
    trinityx_repositories: '{{ ood_repositories }}'
    external_repository_rpms: {}
    package_based_repositories: []
    use_baseurl_repositories: []
  when:
    - ood_repositories is defined
    - ansible_os_family == "RedHat"

- name: Install OOD apt repo keys
  ansible.builtin.apt_key:
    state: present
    url: "{{ item.key_url }}"
    id: "{{ item.key_id }}"
  loop: "{{ ood_debs }}"
  when: ansible_os_family == "Debian"

- name: Install OOD apt repo packages
  ansible.builtin.apt:
    deb: "{{ item.deb }}"
    state: present
    update_cache: true
    dpkg_options: force-confnew
  loop: "{{ ood_deb_repos }}"
  when: ansible_os_family == "Debian"
  tags: install-only

- name: Install required rpms
  ansible.builtin.dnf:
    name: "{{ item.name }}"
    state: present
    disable_gpg_check: "{{ item.no_gpgcheck | default(False) }}"
  with_items: "{{ ood_packages }}"
  retries: "{{ rpm_retries | default(3) }}"
  delay: "{{ rpm_delay | default(15) }}"
  notify: Run update_ood
  when: ansible_os_family == "RedHat"
  tags: install-only

- name: Install required apt packages
  ansible.builtin.apt:
    name: "{{ item.name }}"
    state: present
    update_cache: true
  loop: "{{ ood_packages }}"
  retries: "{{ rpm_retries | default(3) }}"
  delay: "{{ rpm_delay | default(15) }}"
  notify: Run update_ood
  when: ansible_os_family == "Debian"
  tags: install-only

- name: Ensure ssl certificate and key exists
  ansible.builtin.file:
    path: "{{ item }}"
    state: file
  with_items:
    - "{{ ood_ssl_certificate }}"
    - "{{ ood_ssl_certificate_key }}"
  when: ood_enable_ssl

- name: Ensure OOD config paths exist
  ansible.builtin.file:
    path: "{{ item }}"
    owner: root
    group: root
    mode: "0755"
    state: directory
  with_items:
    - /etc/ood/config/
    - /etc/ood/config/clusters.d
    - /etc/ood/config/apps
    - /etc/ood/config/apps/bc_desktop

- name: Render OOD ood_portal.yml config file
  ansible.builtin.template:
    src: ood_portal.yml.j2
    dest: "{{ ood_cfg_path }}/ood_portal.yml"
    mode: "0644"
    owner: root
    group: root
  notify: Run update_ood
  tags: branding

- name: Render OOD nginx_stage.yml config file
  ansible.builtin.template:
    src: branding/TrinityX/nginx_stage.yml.j2
    dest: "{{ ood_cfg_path }}/nginx_stage.yml"
    mode: "0644"
    owner: root
    group: root
  notify: Run update_ood
  tags: branding

- name: Render OOD cluster config file
  ansible.builtin.template:
    src: cluster.yml.j2
    dest: "{{ ood_cfg_path }}/clusters.d/{{ ood_cluster_name }}.yml"
    mode: "0644"
    owner: root
    group: root
  notify: Run update_ood

- name: Copy TrinityX branding to /var/www/ood/public
  ansible.builtin.copy:
    src: branding/TrinityX/{{ item }}
    dest: /var/www/ood/public/{{ item }}
    mode: "0644"
    owner: root
    group: root
  with_items:
    - favicon.ico
    - logo.png
    - custom.css
    - TrinityX-Logo-Main.png
  when: ood_brand == "TrinityX"
  notify: Run update_ood
  tags: branding

- name: Apply TrinityX en.yml (welcome_html) branding
  ansible.builtin.template:
    src: branding/TrinityX/en.yml.j2
    dest: /var/www/ood/apps/sys/dashboard/config/locales/en.yml
    mode: "0644"
    owner: root
    group: root
    backup: "yes"
  when: ood_brand == "TrinityX"
  notify: Run update_ood
  tags: branding

- name: Create /etc/ood/config/ondemand.d if not present
  ansible.builtin.file:
    path: /etc/ood/config/ondemand.d
    state: directory
    mode: "0755"
    owner: root
    group: root
  when: ood_brand == "TrinityX"
  notify: Run update_ood
  tags: branding

- name: Apply TrinityX ondemand.yml branding
  ansible.builtin.template:
    src: branding/TrinityX/ondemand.yml.j2
    dest: /etc/ood/config/ondemand.d/ondemand.yml
    mode: "0644"
    owner: root
    group: root
    backup: "yes"
  when: ood_brand == "TrinityX"
  notify: Run update_ood
  tags: branding

- name: Override default 404 page to auto initialize app
  ansible.builtin.blockinfile:
    path: /opt/ood/nginx_stage/lib/nginx_stage/views/pun_config_view.rb
    marker: "{mark}"
    marker_begin: "    def restart_confirmation"
    marker_end: "    end"
    block: |
      {% filter indent(width=6, first=true) %}
      <<-EOF.gsub("'", %q{\\\'})
        <html>
        <head>
        <title>Restart PUN</title>
        </head>
        <body>
          <script>
          window.location.href = '#{app_init_url}';
          </script>
        </body>
        </html>
      EOF
      {% endfilter %}
    state: present
  when: ood_brand == "TrinityX"
  notify: Run update_ood
  tags: branding

- name: Ensuring correct permissions to pun config view
  ansible.builtin.file:
    path: /opt/ood/nginx_stage/lib/nginx_stage/views/pun_config_view.rb
    owner: root
    group: root
    mode: "0644"
  when: ood_brand == "TrinityX"
  tags: branding

- name: Configure firewalld
  ansible.posix.firewalld:
    state: "{{ 'enabled' if ood_open_port else 'disabled' }}"
    port: "{{ ood_port }}/tcp"
    permanent: "yes"
    immediate: "yes"
  when: not in_login_image|default(False)
  tags: firewalld

- name: Ensure OOD layout folder exists
  ansible.builtin.file:
    path: "{{ ood_footer_dir}}"
    state: directory
    mode: '0755'
    owner: root
    group: root
  when: ood_brand == "TrinityX"
  tags: branding

- name: Add releaseversion to the OOD footer
  ansible.builtin.template:
    src: "{{ ood_footer_file }}.j2"
    dest: "{{ ood_footer_dir }}/{{ ood_footer_file }}"
    owner: root
    group: root
    mode: '0644'
  when: ood_brand == "TrinityX"
  notify: Run update_ood
  tags: branding

- name: Include auth task
  ansible.builtin.include_tasks: dex-auth.yml
  tags: install-only

- name: Include auth task
  ansible.builtin.include_tasks: pam-auth.yml
  tags: install-only

- name: Include tasks for login image
  ansible.builtin.include_tasks: login.yml

- name: Ensure OOD placeholder public directory exists
  ansible.builtin.file:
    path: "{{ ood_placeholder_public_dir }}"
    state: directory
    mode: "0755"
    owner: root
    group: root
  when: ood_placeholder_check_enabled | default(True)

- name: Render OOD placeholder page
  ansible.builtin.template:
    src: placeholder/index.html.j2
    dest: "{{ ood_placeholder_public_dir }}/index.html"
    mode: "0644"
    owner: root
    group: root
  when: ood_placeholder_check_enabled | default(True)

- name: Ensure OOD placeholder script directory exists
  ansible.builtin.file:
    path: "{{ ood_placeholder_script_dir }}"
    state: directory
    mode: "0755"
    owner: root
    group: root
  when: ood_placeholder_check_enabled | default(True)

- name: Render OOD placeholder check script
  ansible.builtin.template:
    src: placeholder/ood-placeholder-check.sh.j2
    dest: "{{ ood_placeholder_check_script }}"
    mode: "0755"
    owner: root
    group: root
  when: ood_placeholder_check_enabled | default(True)

- name: Render OOD placeholder unset script
  ansible.builtin.template:
    src: placeholder/ood-placeholder-unset.sh.j2
    dest: "{{ ood_placeholder_unset_script }}"
    mode: "0755"
    owner: root
    group: root
  when: ood_placeholder_check_enabled | default(True)

- name: Apply pending OOD portal changes before endpoint check
  ansible.builtin.meta: flush_handlers

- name: Enable OOD webserver on startup
  ansible.builtin.service:
    name: "{{ ood_apache_service_name }}"
    enabled: "yes"
    state: started

- name: Run OOD placeholder HTTP 500 check
  ansible.builtin.command: "{{ ood_placeholder_check_script }}"
  register: ood_placeholder_check_result
  changed_when: "'placeholder enabled' in ood_placeholder_check_result.stdout"
  when:
    - ood_placeholder_check_enabled | default(True)
    - not in_login_image | default(False)
