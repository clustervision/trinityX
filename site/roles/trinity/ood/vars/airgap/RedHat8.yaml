---
# EL8.10 is the only EL8 minor offering ruby 3.3, and it has no nodejs 22.
ood_release: '4.0'

ood_packages:
  - name: "{{ ['httpd'] + ood_release_runtimes[ood_release] + ['ondemand', 'luna2-python'] }}"

ood_repositories:
  - name: ondemand-web
    repo: https://{{ ag_server }}/{{ ag_repo }}/repos/ondemand-web
    gpgcheck: False
