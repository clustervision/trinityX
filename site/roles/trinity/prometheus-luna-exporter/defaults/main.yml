---
prometheus_luna_exporter_version: 0.0.1
prometheus_luna_exporter_binary_url: "https://updates.clustervision.com/trinityx/external/monitoring/prometheus-luna-exporter/{{system_arch}}/binaries/{{trix_stream}}/prometheus-luna-exporter.{{prometheus_luna_exporter_version}}"

prometheus_luna_exporter_web_listen_port: "14210"
prometheus_luna_exporter_web_listen_host: "0.0.0.0"

prometheus_luna_exporter_log_dir: "/var/log/prometheus"

prometheus_luna_exporter_binary_install_dir: "/usr/local/bin"
# Controller-side scratch for the delegated download. trix_tmpdir is only set
# where trinity/init runs (the controller); image plays run init-nodes and do not.
prometheus_luna_exporter_download_dir: "{{ trix_tmpdir | default('/tmp', true) }}"

prometheus_luna_exporter_system_user: "root"
prometheus_luna_exporter_system_group: "root"
prometheus_luna_exporter_additional_system_groups: []

prometheus_luna_exporter_packages: []
