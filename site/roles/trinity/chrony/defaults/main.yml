---
# vars file for chrony

chrony_packages:
  - chrony

chrony_upstream_servers:
  - '0.centos.pool.ntp.org'
  - '1.centos.pool.ntp.org'
  - '2.centos.pool.ntp.org'
  - '3.centos.pool.ntp.org'

# allow all if not networks are specified
chrony_allow_networks: []

chrony_as_server: False

chrony_conf_path: "{{ '/etc/chrony/chrony.conf' if ansible_os_family == 'Debian' else '/etc/chrony.conf' }}"
chrony_service: "{{ 'chrony' if ansible_os_family == 'Debian' else 'chronyd' }}"
