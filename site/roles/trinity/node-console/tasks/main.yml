---
# tasks file for trinity/node-console
#
# Sets up full node console access for TrinityX compute nodes:
#   - Serial console (ttyS0) — visible over IPMI or Redfish SOL from day one
#   - Kernel netconsole (UDP) — streams printk to the controller once network is up
#   - Controller packages required by lconsole (ipmitool, sshpass)
#
# lconsole default mode: SOL first → auto-handoff to netconsole once loaded
# lconsole --netconsole: netconsole UDP only
# lconsole --sol-only:   interactive SOL only (IPMI or Redfish)

# -------------------------------------------------------------------------
# CONTROLLER side — packages
# -------------------------------------------------------------------------

- name: Ensure ipmitool is installed on controller (lconsole --sol-backend=ipmi)
  package:
    name: "{{ node_console_controller_packages_ipmi }}"
    state: present
  when: on_controller | default(False)

- name: Ensure sshpass is installed on controller (lconsole --sol-backend=redfish)
  package:
    name: "{{ node_console_controller_packages }}"
    state: present
  when: on_controller | default(False)

# -------------------------------------------------------------------------
# Resolve controller MAC address (runs once, on the controller itself).
# Needed because trix_ctrl_interface is only set on the controller play,
# not inside the image-build play context.
# -------------------------------------------------------------------------

- name: Resolve controller cluster interface MAC (from controller facts)
  set_fact:
    netconsole_ctrl_mac: >-
      {{ hostvars['localhost']['ansible_' + item]['macaddress'] }}
  when:
    - netconsole_ctrl_mac == ""
    - hostvars['localhost']['ansible_' + item] is defined
    - hostvars['localhost']['ansible_' + item]['ipv4'] is defined
    - hostvars['localhost']['ansible_' + item]['ipv4']['address'] == trix_ctrl_ip
  loop: "{{ hostvars['localhost']['ansible_interfaces'] }}"

- name: Fail if controller MAC could not be resolved
  fail:
    msg: >
      Could not determine the controller MAC address for interface carrying
      {{ trix_ctrl_ip }}. Set netconsole_ctrl_mac explicitly in group_vars.
  when: netconsole_ctrl_mac == ""

# -------------------------------------------------------------------------
# NODE / IMAGE side
# -------------------------------------------------------------------------

- name: Deploy node-console setup script into image
  template:
    src: netconsole-setup.sh.j2
    dest: "{{ netconsole_setup_script }}"
    owner: root
    group: root
    mode: "0755"
  when: in_image | default(False)

- name: Deploy node-console systemd service unit into image
  template:
    src: netconsole-setup.service.j2
    dest: "/etc/systemd/system/{{ netconsole_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  when: in_image | default(False)

- name: Enable node-console-setup service in image (starts at node boot)
  systemd:
    name: "{{ netconsole_service_name }}"
    enabled: true
  when: in_image | default(False)

- name: Ensure required kernel modules are included in Luna osimage
  # netconsole         : kernel UDP log transport (node → controller)
  # ipmi_devintf       : /dev/ipmi0 — required by ipmitool on the node side
  # ipmi_si            : IPMI System Interface (KCS/SMIC/BT)
  # ipmi_msghandler    : IPMI message handler base (required by ipmi_si)
  shell: >
    luna osimage change
    --kernelmodules "{{ node_console_kernel_modules }}"
    {{ inventory_hostname | regex_replace('\.osimages\.luna$', '') }}
  delegate_to: localhost
  when: in_image | default(False)

- name: Inject serial console + netconsole kernel cmdline parameters into Luna osimage
  # Parameters injected:
  #   console=tty0
  #       Keep local VGA console working (useful for physical access / KVM).
  #
  #   console=<device>,<speed>n8
  #       Enable serial console from the very first kernel message.
  #       This is what IPMI SOL and Redfish SSH SOL see — without this the
  #       serial port is silent during early boot.
  #       lconsole (default mode) opens SOL first precisely to capture this.
  #
  #   netconsole=<port>@/,<port>@<ctrl_ip>/<ctrl_mac>
  #       Static kernel-level netconsole config as a fallback / fast path.
  #       @/ means kernel auto-detects node src-IP and interface at boot time.
  #       The runtime node-console-setup.sh service also loads the module
  #       dynamically (with the actual runtime IP) for more reliable results.
  #
  shell: >
    luna osimage change
    --quick-kerneloptions
    "console=tty0 console={{ serial_console_device }},{{ serial_console_speed }}n8 netconsole={{ netconsole_port }}@/,{{ netconsole_port }}@{{ netconsole_ctrl_ip }}/{{ netconsole_ctrl_mac }}"
    {{ inventory_hostname | regex_replace('\.osimages\.luna$', '') }}
  delegate_to: localhost
  when: in_image | default(False)

# -------------------------------------------------------------------------
# CONTROLLER side — firewall / SELinux
# -------------------------------------------------------------------------

# The cluster interface is typically in the firewalld trusted zone and already
# allows all traffic from nodes. We open the port explicitly on the trusted
# zone so it also works in non-standard deployments with a more restrictive zone.

- name: Open netconsole UDP port in firewalld (trusted zone, controller only)
  firewalld:
    zone: trusted
    port: "{{ netconsole_port }}/udp"
    state: enabled
    permanent: true
    immediate: true
  when: on_controller | default(False)
  ignore_errors: true

- name: Add SELinux label for netconsole UDP port (controller only)
  seport:
    ports: "{{ netconsole_port }}"
    proto: udp
    setype: syslogd_port_t
    state: present
  when:
    - on_controller | default(False)
    - ansible_selinux.status == "enabled"
  ignore_errors: true
