---
# trinity/node-console — console access for TrinityX compute nodes, over
# Serial-over-LAN through each node's BMC.

# --- controller: packages ---
- name: Install packages on controller
  ansible.builtin.package:
    name: "{{ node_console_packages }}"
    state: present
  when: on_controller | default(False)

# --- osimage: serial console on the kernel command line ---

- name: Inject serial console kernel cmdline into Luna osimage
  # The SOL port is listed TWICE, deliberately:
  #   console=uart,io,<addr>  — binds by IO address at the first kernel
  #     instruction; immune to port-probe timing, carries printk always.
  #   console=ttyS<n> (last)  — the real console with a tty device behind
  #     it; /dev/console resolves to it, so installer and systemd output
  #     reach SOL too (a bootconsole alone cannot carry /dev/console).
  # Do NOT add the other legacy port as a third console: two *named* 8250
  # consoles on the cmdline stop the second one from binding at all
  # (observed on an EL8 kernel — console=ttyS0 console=ttyS1 leaves ttyS1
  # dead), which silently reverts the whole setup.
  # Which port the BMC taps is a per-board property (Supermicro is commonly
  # COM2/ttyS1); this firmware publishes no ACPI SPCR, so it cannot be
  # auto-detected from the OS. To find it on new hardware: attach lconsole
  # to a booted node and on that node run
  #   stty -F /dev/ttyS<N> 115200 -crtscts raw; echo test > /dev/ttyS<N>
  # — the port whose 'test' appears in the SOL session is the one.
  shell: >
    luna osimage change
    --quick-kerneloptions
    "console=tty0
    console=uart,io,{{ '0x3f8' if serial_console_device == 'ttyS0' else '0x2f8' }},{{ serial_console_speed }}n8
    console={{ serial_console_device }},{{ serial_console_speed }}n8"
    {{ inventory_hostname | regex_replace('\.osimages\.luna$', '') }}
  delegate_to: localhost
  when: in_image | default(False)

# --- controller: sol-grab (on-demand SOL capture for the nodeboot GUI's
# console panel) ---
# The script itself (sol_grab.py) is NOT deployed by this role — it imports
# utils.lconsole and so ships with luna2-utils, installed the same way
# lconsole.py itself is. This role only owns the systemd unit that runs it.

- name: Create console capture log directory
  file:
    path: "{{ sol_grab_log_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: on_controller | default(False)

- name: Deploy sol-grab systemd service
  template:
    src: sol-grab.service.j2
    dest: "/etc/systemd/system/{{ sol_grab_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  when: on_controller | default(False)
  notify: restart sol-grab

- name: Enable and start sol-grab
  systemd:
    name: "{{ sol_grab_service_name }}"
    enabled: true
    state: started
    daemon_reload: true
  when: on_controller | default(False)

# --- controller: firewall ---

- name: Open sol-grab TCP port in firewalld
  firewalld:
    zone: trusted
    port: "{{ sol_grab_port }}/tcp"
    state: enabled
    permanent: true
    immediate: true
  when: on_controller | default(False)
  ignore_errors: true
