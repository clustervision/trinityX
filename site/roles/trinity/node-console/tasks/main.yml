---
# trinity/node-console — full console access for TrinityX compute nodes.

# --- controller: packages ---
- name: Install packages on controller
  ansible.builtin.package:
    name: "{{ node_console_packages }}"
    state: present
  when: on_controller | default(False)

# --- resolve controller MAC address ---
# Mirrors trinity/init find-interface.yml: gather network facts via
# delegate_to so it works from both controller and chroot play contexts.

- name: Gather controller network facts
  setup:
    gather_subset: ['!all', 'network']
  delegate_to: localhost
  delegate_facts: true
  run_once: true
  when: netconsole_ctrl_mac == ""

- name: Resolve controller MAC from primary IPv4
  set_fact:
    netconsole_ctrl_mac: "{{ hostvars['localhost']['ansible_' + item]['macaddress'] }}"
  when:
    - netconsole_ctrl_mac == ""
    - hostvars['localhost']['ansible_' + item]['ipv4'] is defined
    - hostvars['localhost']['ansible_' + item]['ipv4']['address'] == trix_ctrl_ip
  with_items: "{{ hostvars['localhost']['ansible_interfaces'] }}"

- name: Resolve controller MAC from secondary IPv4
  set_fact:
    netconsole_ctrl_mac: "{{ hostvars['localhost']['ansible_' + item]['macaddress'] }}"
  when:
    - netconsole_ctrl_mac == ""
    - hostvars['localhost']['ansible_' + item]['ipv4_secondaries'] is defined
    - hostvars['localhost']['ansible_' + item]['ipv4_secondaries']
      | selectattr('address', 'equalto', trix_ctrl_ip) | list | length > 0
  with_items: "{{ hostvars['localhost']['ansible_interfaces'] }}"

- name: Fail if controller MAC could not be resolved
  fail:
    msg: >
      No interface on the controller carries {{ trix_ctrl_ip }}.
      Set netconsole_ctrl_mac explicitly in group_vars or defaults/main.yml.
  when: netconsole_ctrl_mac == ""

# --- image: netconsole setup script and service ---

- name: Deploy node-console setup script into image
  template:
    src: netconsole-setup.sh.j2
    dest: "{{ netconsole_setup_script }}"
    owner: root
    group: root
    mode: "0755"
  when: in_image | default(False)

- name: Deploy node-console systemd service into image
  template:
    src: netconsole-setup.service.j2
    dest: "/etc/systemd/system/{{ netconsole_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  when: in_image | default(False)

- name: Enable node-console-setup service in image
  systemd:
    name: "{{ netconsole_service_name }}"
    enabled: true
  when: in_image | default(False)

# --- image: booted-notify one-shot ("booted" state at first boot) ---

- name: Deploy booted-notify script into image
  template:
    src: booted-notify.sh.j2
    dest: "{{ booted_notify_script }}"
    owner: root
    group: root
    mode: "0755"
  when: in_image | default(False)

- name: Deploy booted-notify systemd service into image
  template:
    src: booted-notify.service.j2
    dest: "/etc/systemd/system/{{ booted_notify_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  when: in_image | default(False)

- name: Enable booted-notify service in image
  systemd:
    name: "{{ booted_notify_service_name }}"
    enabled: true
  when: in_image | default(False)

- name: Add kernel modules to Luna osimage
  shell: >
    luna osimage change
    --kernelmodules "{{ node_console_kernel_modules }}"
    {{ inventory_hostname | regex_replace('\.osimages\.luna$', '') }}
  delegate_to: localhost
  when: in_image | default(False)

- name: Inject serial console + netconsole kernel cmdline into Luna osimage
  # console=ttyS0,115200n8  — serial console active from first kernel message (IPMI/Redfish SOL)
  # netconsole=6666@/,...   — static netconsole fallback; @ / means kernel auto-detects src-IP
  shell: >
    luna osimage change
    --quick-kerneloptions
    "console=tty0 console={{ serial_console_device }},{{ serial_console_speed }}n8 netconsole={{ netconsole_port }}@/,{{ netconsole_port }}@{{ netconsole_ctrl_ip }}/{{ netconsole_ctrl_mac }}"
    {{ inventory_hostname | regex_replace('\.osimages\.luna$', '') }}
  delegate_to: localhost
  when: in_image | default(False)

# --- controller: firewall / SELinux ---

- name: Open netconsole UDP port in firewalld
  firewalld:
    zone: trusted
    port: "{{ netconsole_port }}/udp"
    state: enabled
    permanent: true
    immediate: true
  when: on_controller | default(False)
  ignore_errors: true

- name: Add SELinux label for netconsole UDP port
  seport:
    ports: "{{ netconsole_port }}"
    proto: udp
    setype: syslogd_port_t
    state: present
  when:
    - on_controller | default(False)
    - ansible_selinux.status == "enabled"
  ignore_errors: true
