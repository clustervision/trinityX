---
# trinity/node-console defaults.
# Override in group_vars or at role invocation.

# --- netconsole (UDP kernel log transport) ---

# UDP port nodes send to; lconsole listens on the same port
netconsole_port: 6666

# Controller cluster IP (defaults to trix_ctrl_ip from group_vars/all.yml)
netconsole_ctrl_ip: "{{ trix_ctrl_ip }}"

# Controller cluster interface MAC — auto-resolved at runtime from trix_ctrl_ip.
# Set explicitly only if auto-detection fails.
netconsole_ctrl_mac: ""

# Boot script and systemd unit deployed inside the compute image
netconsole_setup_script: /usr/local/sbin/node-console-setup.sh
netconsole_service_name: node-console-setup

# Seconds the boot script waits for a usable route to the controller
netconsole_route_wait_timeout: 60

# --- serial console (SOL) ---

# Serial device and baud rate for kernel early-boot output and SOL.
# Override to ttyS1/ttyS2 if the platform uses a different port.
serial_console_device: ttyS0
serial_console_speed: 115200

# --- lconsole handoff marker ---

# Written to /dev/kmsg by the node once netconsole loads.
# lconsole default hybrid mode watches for this to close SOL.
netconsole_ready_marker: TRINITYX_LCONSOLE_NETCONSOLE_READY

# --- packages ---

# Installed on the controller only
node_console_controller_packages:
  - sshpass

node_console_controller_packages_ipmi:
  - ipmitool

# --- Luna osimage kernel modules ---

node_console_kernel_modules: "netconsole,ipmi_devintf,ipmi_si,ipmi_msghandler"
