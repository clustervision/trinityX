---
# trinity/node-console defaults.
# Override in group_vars or at role invocation.

# --- serial console (SOL) ---

# The serial port the BMC's SOL actually taps — a per-board property (BIOS
# Console Redirection decides it; Supermicro boards are commonly COM2 =
# ttyS1). Set this per cluster/hardware profile. The rendered kernel cmdline
# lists BOTH legacy ports with this one last (primary), so a wrong value
# still shows the kernel boot over SOL — only the installer/systemd lines go
# missing, which points straight at this setting. Detection recipe is in
# tasks/main.yml next to the task.
serial_console_device: ttyS1
serial_console_speed: 115200

# --- sol-grab (on-demand, bounded SOL capture feeding the nodeboot GUI's
# console panel) ---

# Controller-side only, on the provisioning controller (BMC network access).
# Deliberately NOT always-on: SOL is one exclusive BMC session per node, so
# holding it fleet-wide would mean thousands of concurrent logins. Grabbed
# only on request, bounded by sol_grab_max_workers, held for
# sol_grab_duration_secs, then dropped. See sol_grab.py's docstring.
sol_grab_port: 6667
sol_grab_service_name: sol-grab
sol_grab_max_workers: 15
sol_grab_duration_secs: 8
sol_grab_max_lines: 500
sol_grab_backend: ipmi
sol_grab_log_dir: /var/log/luna/console

# --- packages ---

# Installed on the controller only
node_console_packages:
  - ipmitool
  - sshpass
