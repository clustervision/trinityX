# Remote assistance tunnel configuration.
# This file is read by remote-assistance.service and remote-assistance.sh.
# Keep permissions restrictive if proxy credentials are configured.

# SSH key pair used to authenticate the reverse tunnel.
REMOTE_ASSISTANCE_PRIVATE_KEY=/root/.ssh/id_rsa
# REMOTE_ASSISTANCE_PUBLIC_KEY=/root/.ssh/id_rsa.pub

# Optional site metadata sent to the support portal.
# If REMOTE_ASSISTANCE_PROJECT_NUMBER is empty, /trinity/site is used when present.
# REMOTE_ASSISTANCE_PROJECT_NUMBER=000000
REMOTE_ASSISTANCE_INFO=

# Network path tuning.
REMOTE_ASSISTANCE_USE_PROXY=n
# REMOTE_ASSISTANCE_PROXY_ADDRESS=proxy.clustervision.com:3128
# REMOTE_ASSISTANCE_PROXY_USER=
# REMOTE_ASSISTANCE_PROXY_PASSWORD=
REMOTE_ASSISTANCE_USE_ALTERNATE_PORT=n
REMOTE_ASSISTANCE_ALTERNATE_HOST=45.138.39.102
REMOTE_ASSISTANCE_ALTERNATE_PORT=443

# Endpoints.
REMOTE_ASSISTANCE_SERVER=sandbox.clustervision.com
REMOTE_ASSISTANCE_STATIC_URL=https://static.clustervision.com
REMOTE_ASSISTANCE_SUPPORT_KEY_URL=https://static.clustervision.com/support.pub
REMOTE_ASSISTANCE_KEYS_URL=https://sandbox.clustervision.com/cgi-bin/keys.py
REMOTE_ASSISTANCE_KEYS_USER=trinityx:trinityx

# Local SSH service exposed through the reverse tunnel.
REMOTE_ASSISTANCE_TARGET_HOST=localhost
REMOTE_ASSISTANCE_TARGET_PORT=22

# Timeouts and keepalives suitable for unattended service operation.
REMOTE_ASSISTANCE_CONNECT_TIMEOUT=15
REMOTE_ASSISTANCE_CURL_MAX_TIME=30
REMOTE_ASSISTANCE_SERVER_ALIVE_INTERVAL=30
REMOTE_ASSISTANCE_SERVER_ALIVE_COUNT_MAX=10
REMOTE_ASSISTANCE_REQUEST_TTY=no
REMOTE_ASSISTANCE_STRICT_HOST_KEY_CHECKING=accept-new
REMOTE_ASSISTANCE_RETRY_SLEEP=5
