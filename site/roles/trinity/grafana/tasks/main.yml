# ----------------

- name: Set external interface ip address fact
  set_fact:
    grafana_ip_address: "{{ trix_external_fqdn }}"
  when: grafana_ip_address is not defined

- debug:
    msg: "Using {{ grafana_ip_address }} for configuring Grafana"

# ----------------

- name: List organisations
  uri:
    method: GET
    url: "{{ grafana_protocol }}://{{ grafana_ip_address }}:{{ grafana_port }}/api/org/"
    user: "{{ grafana_admin }}"
    password: '{{ grafana_admin_pwd }}'
    return_content: true
    force_basic_auth: true
    validate_certs: "no"
    use_proxy: "no"
  register: grafana_orgs

- name: Configure organization
  uri:
    method: PUT
    url: "{{ grafana_protocol }}://{{ grafana_ip_address }}:{{ grafana_port }}/api/org"
    user: "{{ grafana_admin }}"
    password: '{{ grafana_admin_pwd }}'
    validate_certs: "no"
    force_basic_auth: true
    use_proxy: "no"
    body_format: json
    body:
      name: '{{ grafana_org_name }}'
  when: grafana_org_name not in grafana_orgs

- name: Set home dashboard
  uri:
    method: PUT
    url: "{{ grafana_protocol }}://{{ grafana_ip_address }}:{{ grafana_port }}/api/org/preferences"
    user: "{{ grafana_admin }}"
    password: '{{ grafana_admin_pwd }}'
    validate_certs: "no"
    force_basic_auth: true
    use_proxy: "no"
    body_format: json
    body:
      homeDashboardUID: "trixhome"

- name: Configure firewalld
  firewalld:
    state: "{{ 'enabled' if grafana_open_port else 'disabled' }}"
    port: "{{ grafana_port }}/tcp"
    permanent: "yes"
    immediate: "yes"
  when: ansible_virtualization_type != 'docker'
  tags: firewalld
