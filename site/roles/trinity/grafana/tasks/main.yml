---
- name: Load Airgap vars
  include_vars: "airgap/main.yaml"
  when: is_airgap | default(False)

- name: Generate grafana admin password and save it to /etc/trinity/passwords
  set_fact:
    grafana_admin_pwd: "{{ lookup('password',
                          '/etc/trinity/passwords/grafana/admin.txt',
                           chars=['ascii_letters','digits','hexdigits']) }}"
- name: Retrieve grafana_alertmanager_basic_auth
  set_fact:
    grafana_alertmanager_basic_auth: "{{ grafana_alertmanager_basic_auth_file is defined and grafana_alertmanager_basic_auth_file | length > 0 }}"
- name: Retrieve grafana_alertmanagerbasic_auth_user
  set_fact:
    grafana_alertmanager_basic_auth_user: "{{ grafana_alertmanager_basic_auth_file | basename | regex_replace('(.*)\\..*', '\\1') }}"
- name: Retrieve grafana_alertmanager_basic_auth_pwd
  set_fact:
    grafana_alertmanager_basic_auth_pwd: "{{ lookup('file', grafana_alertmanager_basic_auth_file) }}"

- name: Retrieve grafana_alert_history_sql_auth
  set_fact:
    grafana_alert_history_sql_auth: "{{ grafana_alert_history_sql_auth_file is defined and grafana_alert_history_sql_auth_file | length > 0 }}"
- name: Retrieve grafana_alert_history_sql_auth_user
  set_fact:
    grafana_alert_history_sql_user: "{{ grafana_alert_history_sql_auth_file | basename | regex_replace('(.*)\\..*', '\\1') }}"
- name: Retrieve grafana_alert_history_sql_auth_pwd
  set_fact:
    grafana_alert_history_sql_password: "{{ lookup('file', grafana_alert_history_sql_auth_file) }}"



- name: Set protocol
  set_fact:
    grafana_protocol: "https"
  when: grafana_enable_ssl

- name: Set protocol
  set_fact:
    grafana_protocol: "http"
  when: not grafana_enable_ssl

- name: Install dependencies
  yum:
    name: python3-firewall
    state: present
  when: ansible_virtualization_type != 'docker'
  retries: "{{ rpm_retries | default(3) }}"
  delay: "{{ rpm_delay | default(15) }}"
  tags: install-only

- block:
  - name: Gather package facts for Grafana upgrade decision
    package_facts:
      manager: auto

  - name: Set grafana_installed fact
    set_fact:
      grafana_installed: "{{ ansible_facts.packages['grafana'] is defined }}"

  - name: Determine if upgrade is needed
    set_fact:
      grafana_needs_upgrade: >-
        {%- if not grafana_installed -%}
        false
        {%- else -%}
        {{ ansible_facts.packages['grafana'][0]['version'] != grafana_version }}
        {%- endif -%}

  - name: Upgrade — stop grafana-server before backup
    systemd:
      name: grafana-server
      state: stopped
    when: grafana_needs_upgrade | bool

  - name: Upgrade — create timestamped backup directory
    file:
      state: directory
      path: "/root/grafana_backup_{{ ansible_date_time.epoch }}"
      owner: root
      group: root
      mode: '0700'
    register: grafana_backup_dir
    when: grafana_needs_upgrade | bool

  - name: Upgrade — backup /var/lib/grafana and /etc/grafana
    archive:
      path:
        - /var/lib/grafana
        - /etc/grafana
      dest: "{{ grafana_backup_dir.path }}/grafana_full_backup.tar.gz"
      format: gz
    when: grafana_needs_upgrade | bool

  - name: Upgrade — record pre-upgrade version info
    copy:
      content: |
        Previous Grafana version: {{ ansible_facts.packages['grafana'][0]['version'] }}
        Target version: {{ grafana_version }}
        Upgrade date: {{ ansible_date_time.iso8601 }}
      dest: "{{ grafana_backup_dir.path }}/upgrade_info.txt"
    when: grafana_needs_upgrade | bool

  - debug:
      msg: >-
        {%- if grafana_needs_upgrade | bool -%}
        Grafana upgrade: {{ ansible_facts.packages['grafana'][0]['version'] }} → {{ grafana_version }}.
        Backup created at {{ grafana_backup_dir.path }}
        {%- elif grafana_installed -%}
        Grafana {{ grafana_version }} already installed. Skipping.
        {%- else -%}
        Grafana not installed. Performing fresh install of {{ grafana_version }}.
        {%- endif -%}
  when: grafana_auto_upgrade

- name: Install/upgrade grafana
  yum:
    name: "{{ grafana_rpm }}"
    disable_gpg_check: true
    state: present
  retries: "{{ rpm_retries | default(3) }}"
  delay: "{{ rpm_delay | default(15) }}"
  tags: install-only

- name: Install camptocamp-prometheus-alertmanager-datasource plugin
  command: grafana cli --pluginUrl="https://{{ grafana_plugin_url }}/trinityx/external/monitoring/camptocamp-prometheus-alertmanager-datasource/{{ trix_stream }}/camptocamp-prometheus-alertmanager-datasource-2.2.0.zip" plugins install camptocamp-prometheus-alertmanager-datasource

- name: Configure LDAP
  template:
    src: ldap.toml.j2
    dest: /etc/grafana/ldap.toml
    owner: root
    group: grafana
  notify: restart grafana-server
  when: ldap_auth

- name: Configure grafana-server
  template:
    src: grafana.ini.j2
    dest: /etc/grafana/grafana.ini
    owner: root
    group: grafana
  notify: restart grafana-server

- name: Add grafana user to ssl group
  user:
    name: grafana
    groups: ssl
    append: "yes"
  when: grafana_enable_ssl


- name: Ensure grafana dashboard directory exists
  file:
    state: directory
    path: "{{ grafana_dashboard_dir }}"
    owner: grafana
    group: grafana

- name: Ensure provisioning directory exists
  file:
    state: directory
    path: "{{ grafana_provisioning_dir }}/{{ item }}"
    owner: grafana
    group: grafana
  with_items:
    - datasources
    - dashboards

- name: Configure Grafana datasources
  template:
    src: trinityx-datasource.yaml.j2
    dest: "{{ grafana_provisioning_dir }}/datasources/trinityx-datasource.yaml"
  notify: restart grafana-server

- name: Configure Grafana dashboards
  template:
    src: trinityx-dashboards.yaml.j2
    dest:  "{{ grafana_provisioning_dir }}/dashboards/trinityx-dashboards.yaml"
  notify: restart grafana-server

- name: Place dashboards
  copy:
    src: "{{ item }}"
    dest: "{{ grafana_dashboard_dir }}/"
    owner: grafana
    group: grafana
  with_fileglob:
  - "files/dashboards/*"
  notify: restart grafana-server

- name: Place branding
  copy:
    src: triX.png
    dest: /usr/share/grafana/public/triX.png

- name: Start and enable Grafana-server
  systemd:
    name: grafana-server
    state: started
    enabled: true

- name: Wait for Grafana to be ready on port {{ grafana_port }}
  wait_for:
    port: "{{ grafana_port }}"
    host: "{{ grafana_ip_address }}"
    delay: 2
    timeout: 60

