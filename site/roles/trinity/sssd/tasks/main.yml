---
# tasks file for sssd

- name: Load a variable file based on the OS type, or a default if not found. Using free-form to specify the file.
  include_vars: "{{ item }}"
  with_first_found:
    - "{{ ansible_os_family }}{{ ansible_distribution_major_version}}.yaml"
    - "{{ ansible_os_family }}.yaml"
  no_log: true
  ignore_errors: true
  tags: admin-change

- name: Install sssd packages
  package:
    name: '{{ sss_packages }}'
    state: present
  retries: "{{ rpm_retries | default(3) }}"
  delay: "{{ rpm_delay | default(15) }}"
  tags: install-only

- block:
  - name: Generate ds389 root password and save it to /etc/trinity/passwords
    set_fact:
      tmp_pwd: "{{ lookup('password',
                          '/etc/trinity/passwords/ds389/root.txt
                           chars=ascii_letters,digits,hexdigits') }}"

  - name: Get ds389 root password from /etc/trinity/passwords
    set_fact:
      ds389_root_pwd: "{{ lookup('password',
                          '/etc/trinity/passwords/ds389/root.txt
                           chars=ascii_letters,digits,hexdigits') }}"
  when: sss_use_ds389 | default(False)
  tags: admin-change

- name: Add configuration file to /etc/sssd/sssd.conf
  template:
    src: 'sssd.conf.j2'
    dest: '{{ sssd_config_location }}/sssd.conf'
    owner: 'root'
    group: 'root'
    mode: '0600'
    # write on override or a first install: of this image when in an image, else of the controller
    force: "{{ override | default(False) | bool or not (image_done_prior if in_image | default(False) else playbook_done_prior | default(False)) }}"
  register: sssd_config_file
  notify: restart sssd

- name: Count the login filter lines in sssd.conf
  command: grep -c '^ldap_access_filter[[:space:]]*=' {{ sssd_config_location }}/sssd.conf
  register: sssd_filter_count
  changed_when: false
  failed_when: false
  check_mode: false
  when: "'admin-change' in ansible_run_tags"
  tags: admin-change

# the filter line is taken from the template, so it has one source
- name: Set the admin group in the sssd.conf login filter
  lineinfile:
    path: '{{ sssd_config_location }}/sssd.conf'
    regexp: '^ldap_access_filter\s*='
    line: "{{ lookup('template', 'sssd.conf.j2') | regex_search('^ldap_access_filter *=.*$', multiline=True) }}"
    # replace only: a missing line is reported below, never appended
    backrefs: true
  register: sssd_filter_line
  notify: restart sssd
  when:
    - "'admin-change' in ansible_run_tags"
    - sssd_filter_count.stdout | default('') == '1'
  tags: admin-change

- name: Report a sssd.conf whose login filter could not be changed
  fail:
    msg: "{{ sssd_config_location }}/sssd.conf has {{ sssd_filter_count.stdout | default('no') }} ldap_access_filter lines, one expected; the admin group in it was not changed. Run with -e override=yes --tags sssd to rewrite it."
  ignore_errors: true
  when:
    - "'admin-change' in ansible_run_tags"
    - sssd_filter_count.stdout | default('') != '1'
  tags: admin-change

- name: Report a kept sssd.conf
  fail:
    msg: "{{ sssd_config_location }}/sssd.conf exists and is left as it is. Run with -e override=yes --tags sssd to rewrite it."
  ignore_errors: true
  when:
    - not override | default(False) | bool
    - not sssd_config_file.changed
    - not sssd_filter_line.changed | default(False)

- name: Ensure certs directory exists
  file:
    path: "{{ ca_certificate_path }}"
    state: directory

- name: Copy CA certificate
  copy:
    remote_src: "{{ False if in_image else True }}"
    src: "{{ ssl_ca_cert }}"
    dest: "{{ ca_certificate_path }}/{{ ssl_ca_cert | basename }}"
  notify: restart sssd

- meta: flush_handlers

- name: Adjust OpenLDAP client TLS configuration
  lineinfile:
    path: "{{ ldap_conf }}"
    line: 'TLS_CACERT   {{ ca_certificate_path }}/{{ ssl_ca_cert | basename }}'
  when: not sss_use_ds389 | default(False)

- name: Enable sssd service
  systemd:
    name: sssd
    enabled: true

- name: Start sssd service
  systemd:
    name: sssd
    state: started
  when: not in_image

  # the below block is there to let sssd start a little later as
  # on slower hardware sssd might fail with 'Providers did not start in time'
  # in the logs. EL10 affected only.
- block:
  - name: Add delay for sssd.service
    copy:
      src: sssd.timer
      dest: /usr/lib/systemd/system/sssd.timer

  - name: Disable sssd service
    systemd:
      name: sssd.service
      enabled: false

  - name: Enable sssd timer
    systemd:
      name: sssd.timer
      enabled: true
  when:
    - in_image
    - ansible_facts['os_family'] == "RedHat"
    - ansible_facts['distribution_major_version']|int > 9

- name: Adding access controler groups to the system
  shell: '/usr/local/sbin/obol group list | grep {{ item }} || /usr/local/sbin/obol group add {{ item }}'
  register: obol_result
  with_items: '{{ sss_allowed_groups }}'
  changed_when: item not in obol_result.stdout
  when: 
    - primary|default(True)
    - on_controller   
    - sss_allowed_groups is defined
    - sss_allowed_groups is iterable
  tags: admin-change

- name: Setting up the system to use sssd for authentication
  command: "{{ item.command }}"
  changed_when: false
  with_items: "{{ sss_authselect_command }}"
  when:
    - item.name == ansible_facts['os_family']
    - item.version == ansible_facts['distribution_major_version']|int

- block:
  - name: Configure nsswitch.conf
    template:
      src: 'nsswitch-manually.conf.j2'
      dest: '/etc/nsswitch.conf'
      owner: 'root'
      group: 'root'
      mode: '0644'

  - name: Configure pam to use sss
    shell: "pam-auth-update --enable sss"

  - name: Configure pam to create homedir on first logon
    shell: "pam-auth-update --enable mkhomedir"
  when: ansible_facts['os_family'] == "Debian"
