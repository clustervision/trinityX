---
# vars file for sssd

sss_packages:
  - authconfig
  - sssd

sss_allowed_groups:
  - admins

# Created in the directory when no account of that name resolves; empty creates none.
sss_admin_user: ''
sss_admin_group: admins
sss_admin_user_password_file: '/etc/trinity/passwords/users/{{ sss_admin_user }}.txt'

sss_ldap_hosts:
  - 'controller.cluster'

sss_filter_enabled: true

# Controllers with trixd: the trixd application domain in conf.d, for /etc/pam.d/trixd.
sss_trixd_domain: false

ca_certificate_path: /etc/openldap/certs/
ldap_conf: /etc/openldap/ldap.conf

sssd_config_location: /etc/sssd

sss_use_ds389: false


sss_authselect_command:
  - name: RedHat
    version: 10
    command: authselect select sssd with-mkhomedir
  - name: RedHat
    version: 9
    #command: authselect select sssd with-mkhomedir --force
    command: authconfig --enablemkhomedir --enablesssd --enablesssdauth --update
  - name: RedHat
    version: 8
    command: authconfig --enablemkhomedir --enablesssd --enablesssdauth --update
  - name: SLE
    version: 15
    command: authselect select sssd with-mkhomedir --force
  - name: Suse
    command: authselect select sssd with-mkhomedir --force
    version: 15
  - name: SLE
    version: 16
    command: authselect select sssd with-mkhomedir --force
  - name: Suse
    command: authselect select sssd with-mkhomedir --force
    version: 16
