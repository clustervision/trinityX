---

# lpart/offline-repo: base URL of the ClusterVision-published TrinityX layer
# (trix / luna2 / additional / slurm / monitoring). Default = upstream, so stock
# behaviour is unchanged. Point it at a local mirror to build without depending on
# updates.clustervision.com being reachable (see offline-repo/ in the lpart installer):
#   -e trix_repo_baseurl=http://<controller>:7060/trinityx
trix_repo_baseurl: "https://updates.clustervision.com/trinityx"

trinityx_repositories:
  - name: trix
    repo: "{{ trix_repo_baseurl }}/{{ trix_version }}/os/{{ hostvars[inventory_hostname].ansible_distribution|lower }}/{{ hostvars[inventory_hostname].ansible_distribution_major_version }}/{{ image_arch | default(system_arch) }}"
    gpgcheck: False
  - name: luna2
    repo: "{{ trix_repo_baseurl }}/{{ trix_version }}/luna2/{{ hostvars[inventory_hostname].ansible_distribution|lower }}/{{ hostvars[inventory_hostname].ansible_distribution_major_version }}/{{ image_arch | default(system_arch) }}"
    gpgcheck: False
  - name: luna2-noarch
    repo: "{{ trix_repo_baseurl }}/{{ trix_version }}/luna2/noarch/rpms"
    gpgcheck: False

external_repository_rpms:
  - name: "{{ trix_repo_baseurl }}/{{ trix_version }}/additional/noarch/rpms/elrepo-release-{{ hostvars[inventory_hostname].ansible_distribution_major_version }}.el{{ hostvars[inventory_hostname].ansible_distribution_major_version }}.elrepo.noarch.rpm"
    file: elrepo-release.rpm
    no_gpgcheck: True

package_based_repositories:
  - name: epel-release

custom_repositories: {}

use_baseurl_repositories:
  - name: elrepo-release

disable_repositories:
  - name: elrepo
  - name: elrepo-testing
  - name: elrepo-kernel
  - name: elrepo-extras

replace_baseurls:
  - name: elrepo
    filter_url: 'http://elrepo.org'
    replace_url: 'http://linux-mirrors.fnal.gov'
  - name: elrepo-testing
    filter_url: 'http://elrepo.org'
    replace_url: 'http://linux-mirrors.fnal.gov'
  - name: elrepo-kernel
    filter_url: 'http://elrepo.org'
    replace_url: 'http://linux-mirrors.fnal.gov'
  - name: elrepo-extras
    filter_url: 'http://elrepo.org'
    replace_url: 'http://linux-mirrors.fnal.gov'

