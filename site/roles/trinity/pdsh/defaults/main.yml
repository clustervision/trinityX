---
# defaults file for pdsh

trinityx_pdsh_version: "2.36"
trinityx_pdsh_repo_baseurl: https://updates.clustervision.com/cv-pdsh
trinityx_pdsh_arch: "{{ system_arch | default(ansible_architecture) }}"

trinityx_pdsh_repositories:
  - name: RedHat
    repo: "{{ trinityx_pdsh_repo_baseurl }}/el/{{ ansible_distribution_major_version }}/{{ trinityx_pdsh_version }}/{{ trinityx_pdsh_arch }}"
    gpgcheck: false

  # Future reference
  # Debian:
  #   type: apt
  #   repo: "deb {{ trinityx_pdsh_repo_baseurl }}/debian {{ ansible_distribution_release }} main"


trinityx_pdsh_packages:
  - pdsh-cv
  - pdsh-cv-rcmd-ssh
