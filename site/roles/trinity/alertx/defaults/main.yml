---

alertx_packages: []

alertx_noarch_pip_repository: "https://updates.clustervision.com/trinityx/{{ trix_version }}/alertx/noarch/pip/{{ trix_stream }}"
alertx_cli_pip: alertx-1.0-py3-none-any.whl

alertx_drainer_base_dir: '{{ trix_local }}/alertx/drainer'
alertx_drainer_daemon_dir: "{{ alertx_drainer_base_dir }}/daemon"
alertx_drainer_ini_dir: "{{ alertx_drainer_base_dir }}/config"
alertx_drainer_log_dir: "/var/log/alertx"
alertx_drainer_enable: true

alertx_history_enable: true
alertx_history_base_dir: '{{ trix_local }}/alertx/history'
alertx_history_daemon_dir: "{{ alertx_history_base_dir }}/daemon"
alertx_history_ini_dir: "{{ alertx_history_base_dir }}/config"
alertx_history_log_dir: "/var/log/alertx"
alertx_history_listen_host: '127.0.0.1'
alertx_history_listen_port: 7151
alertx_history_sql_host: '127.0.0.1'
alertx_history_sql_port: 3306
alertx_history_sql_db: 'alertx_history'
alertx_history_sql_user: 'alertx_history'
alertx_history_sql_table: 'alert_history_events'
alertx_history_retention_days: 180
