---
# Called by ood-apps right after the apps' luna.ini, as 3.0 is re-pointed on an upgrade.

- name: Render the OOD apps trixd.ini
  template:
    src: trixd-client.ini.j2
    dest: '{{ trixd_ood_config_dir }}/trixd.ini'
    owner: root
    group: '{{ trixd_ood_group }}'
    mode: '0640'
  vars:
    trixd_client_endpoint: '{{ trix_ctrl_hostname }}.{{ trix_domain }}'
