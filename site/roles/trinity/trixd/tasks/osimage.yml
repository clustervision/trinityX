---
# What luna osimage create reads from trixd's configuration directory.

# Written once and then the site's own, so an edit is never overwritten; trixd reads it
# at every image create, so no restart.
- name: Create the osimage mirrors file for a site to edit
  template:
    src: osimage-mirrors.yaml.j2
    dest: '{{ trixd_config_dir }}/osimage-mirrors.yaml'
    owner: root
    group: root
    mode: '0644'
    force: false
